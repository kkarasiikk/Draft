# Автодеплой статики на GitHub Pages. Кожен пуш у main, який пройшов тести,
# сам оновлює живий сайт — щоб більше не було «у гілці працює, а на телефоні
# стара версія».
#
# Разова дія на боці репозиторію: Settings → Pages → Source: «GitHub Actions».
# Жодних секретів не потрібно — деплой іде під вбудованим GITHUB_TOKEN.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Кнопка «Run workflow» — щоб перевикласти сайт вручну, без нового коміту.
  workflow_dispatch:

# Дозволи рівно для публікації Pages, не більше.
permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно — лише один деплой; новий скасовує застарілий у черзі.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Спершу гейт: якщо юніт-тести або синтаксис падають, сайт не оновлюється.
  # Повну браузерну сюїту ганяє окремий CI (ci.yml) на цей самий коміт.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Синтаксис усіх JS
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f" || exit 1
          done
      - name: Юніт-тести
        run: npm test

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Зібрати статику сайту
        # Кладемо на сайт лише те, що реально віддається браузеру. Беремо
        # відстежувані git-ом файли (git archive) — так node_modules і будь-що
        # незакомічене відпадає само, — а тоді прибираємо те, що браузеру не
        # потрібне: джерела Cloud Functions, тести, оснастку навантаження й
        # конфіги деплою.
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site

          # Теки з розробки.
          rm -rf _site/ui-tests _site/load-test _site/.github

          # Генератор іконок: потрібен, щоб їх перерахувати, а не браузеру.
          rm -f _site/icons/build.html

          # Cloud Functions і серверні конфіги. ВАЖЛИВО: тут лише КОРЕНЕВІ
          # шляхи — фронтендний tasks/reminders.js лишається, бо до Cloud
          # Function reminders.js стосунку не має.
          rm -f _site/index.js _site/ai.js _site/reminders.js \
                _site/fakeFirestore.js _site/firebase.json \
                _site/firestore.rules _site/firestore.indexes.json \
                _site/playwright.config.js _site/package.json _site/package-lock.json

          # Усі тести, на будь-якому рівні.
          find _site -name '*.test.js' -delete

          # Версія кешу service worker. Раніше її бампали руками в пʼятьох
          # файлах — і це вже одного разу коштувало «змін на сайті не видно».
          # Тепер вона просто дорівнює SHA коміта: кожен деплой — новий кеш,
          # старий прибирається сам, і забути нема чого.
          # Перевіряємо, що заміна справді сталась: мовчазний промах тут
          # означав би, що оболонка назавжди лишилась на версії __BUILD__.
          sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/sw-core.js
          if grep -q "__BUILD__" _site/sw-core.js; then
            echo "sw-core.js: плейсхолдер версії лишився на місці"; exit 1
          fi
          if ! grep -q "${GITHUB_SHA}" _site/sw-core.js; then
            echo "sw-core.js: SHA не знайдено після заміни"; exit 1
          fi

          # Вимикаємо обробку Jekyll — сайт віддається як є, побайтно.
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Контроль: на сайті лежить САМЕ наша збірка.
  #
  # «Зелений деплой» не означає «оновлений сайт». Pages можна складати двома
  # шляхами водночас — цим workflow (Settings → Pages → Source: GitHub Actions)
  # і вбудованим гілковим складанням (Source: гілка). Тоді на кожен пуш іде два
  # деплої на ту саму адресу, живим лишається той, що добіг останнім, і обидва
  # звітують «success».
  #
  # Гілкове складання викладає файли як вони лежать у репозиторії — тобто з
  # плейсхолдером замість версії кешу. Назва кеша перестає змінюватись між
  # деплоями, і правки доходять до телефона з запізненням на один запуск
  # застосунку. Рівно це вже сталось: дві правки поспіль не було видно, а всі
  # перевірки при цьому стояли зелені.
  #
  # Тому після деплою просто читаємо sw-core.js з живого сайту й шукаємо в
  # ньому SHA цього коміта. Перевіряємо двічі з перервою: другий деплой, якщо
  # він є, встигає перебити перший за секунди.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: На сайті лежить версія цього коміта
        env:
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          target="${SITE%/}/sw-core.js"
          echo "Перевіряю $target"

          has_sha() {
            body=$(curl -fsS --max-time 20 "$target" 2>/dev/null || true)
            [ -n "$body" ] && printf '%s' "$body" | grep -q "${GITHUB_SHA}"
          }

          # Перший раз — з очікуванням: Pages роздає нову версію не миттєво.
          found=""
          for attempt in 1 2 3 4 5 6; do
            if has_sha; then found="yes"; break; fi
            echo "спроба $attempt: версії ${GITHUB_SHA} ще немає, чекаю 20 с"
            sleep 20
          done

          fail() {
            echo "::error::$target не містить ${GITHUB_SHA} — на сайті не наша збірка."
            echo "Найімовірніша причина: Pages складає сайт ще й з гілки."
            echo "Лікується один раз: Settings → Pages → Build and deployment →"
            echo "Source: GitHub Actions. Тоді гілкове складання зникає."
            exit 1
          }

          [ -n "$found" ] || fail

          # Другий раз — чи не перебив нас паралельний деплой.
          echo "версія на місці; перевіряю ще раз за 45 с"
          sleep 45
          has_sha || fail

          echo "Готово: на сайті sw-core.js версії ${GITHUB_SHA}"

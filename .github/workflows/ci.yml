# Мінімальний CI: те саме, що досі доводилось пам'ятати прогнати руками —
# перевірка синтаксису всіх JS-файлів (фронтенд автотестами не покритий)
# і юніт-тести Cloud Functions.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Перевірка синтаксису JS
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f" || exit 1
          done
      - name: Юніт-тести Cloud Functions
        run: npm test

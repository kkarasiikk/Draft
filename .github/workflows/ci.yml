# CI: те саме, що досі доводилось пам'ятати прогнати руками — перевірка
# синтаксису всіх JS-файлів, юніт-тести чистих функцій і UI-тести форм
# у справжньому браузері.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Перевірка синтаксису JS
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f" || exit 1
          done
      - name: Юніт-тести Cloud Functions
        run: npm test

  # Браузерні тести окремою job: їм потрібен Chromium (~150 МБ), і тримати
  # цю вагу в основній перевірці означало б платити нею за кожну дрібну
  # правку. Падіння тут так само блокує merge.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Встановити Chromium
        run: |
          # `--with-deps` спершу робить apt-get update, а образ руннера має
          # підключене дзеркало Google Chrome. Коли те дзеркало віддає биту
          # контрольну суму (як 9 вересня: Release-файл оновили, а
          # Packages.gz лишився старий), apt зупиняється — і встановлення
          # падає, ще не дійшовши до тестів.
          #
          # При тому жодна потрібна нам бібліотека звідти не береться:
          # Playwright ставить власну збірку Chromium, а системні
          # залежності до неї — зі штатних репозиторіїв Ubuntu. Тобто це
          # джерело нам не потрібне взагалі, і без нього перевірка більше
          # не залежить від чужого дзеркала.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium
      - name: UI-тести форм
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

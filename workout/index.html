<!DOCTYPE html>
<html lang="uk" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Life — тренування: швидкий лоґінг підходів, прогресія, особисті рекорди.">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com;
  frame-src https://www.google.com/recaptcha/ https://me-and-only-me-7f531.firebaseapp.com;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Тренування · Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../budget/icon-192.png">
<link rel="icon" href="../budget/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<style>
  :root{
    --bg:#EDEEF3;
    --bg-radial: radial-gradient(circle at top, #ffffff 0%, #eceef4 45%, #dfe1ea 100%);
    --blob1:#ffffffb0; --blob2:#8fa6e070;
    --surface:linear-gradient(155deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
    --surface-flat: rgba(255,255,255,.5);
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:rgba(255,255,255,.55); --income:#4F9C74; --income-light:rgba(79,156,116,.14); --expense:#C9683F; --expense-light:rgba(201,104,63,.13); --accent:#4A6FA5; --accent-light:rgba(74,111,165,.13);
    --control-bg:rgba(255,255,255,.35); --overlay:rgba(30,32,40,.28);
    --glass-blur:22px; --glass-shadow:0 8px 32px rgba(40,44,70,.10), inset 0 1px 0 rgba(255,255,255,.6);
    --card-bg: rgba(20,25,40,.035); --card-border: rgba(20,25,40,.10); --card-border-hover: rgba(20,25,40,.22);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(20,25,40,.10), 0 0 60px rgba(20,25,40,.05);
    --glass-btn-bg: rgba(20,25,40,.05); --glass-btn-bg-hover: rgba(20,25,40,.09); --glass-btn-border: rgba(20,25,40,.16);
    --low:#4F9C74; --medium:#4A6FA5; --high:#C9683F;
    --low-light:rgba(79,156,116,.14); --medium-light:rgba(74,111,165,.13); --high-light:rgba(201,104,63,.13);
    --gold:#B8912F; --gold-light:rgba(184,145,47,.14);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0B0B0E;
    --bg-radial: radial-gradient(circle at top, #353535 0%, #181818 45%, #0d0d0d 100%);
    --blob1:#ffffff15; --blob2:#c48fe040;
    --surface:linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    --surface-flat: rgba(255,255,255,.06);
    --ink:#EFEEF3; --ink-soft:#C4C2CE; --ink-muted:#8E8C99;
    --border:rgba(255,255,255,.12); --income:#7FCB9E; --income-light:rgba(127,203,158,.14); --expense:#E39A76; --expense-light:rgba(227,154,118,.14);
    --accent:#6F93D6; --accent-light:rgba(143,174,224,.16); --control-bg:rgba(255,255,255,.05); --overlay:rgba(0,0,0,.55);
    --glass-blur:22px; --glass-shadow:0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    --card-bg: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.12); --card-border-hover: rgba(255,255,255,.25);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(255,255,255,.08), 0 0 60px rgba(255,255,255,.04);
    --glass-btn-bg: rgba(255,255,255,.08); --glass-btn-bg-hover: rgba(255,255,255,.16); --glass-btn-border: rgba(255,255,255,.18);
    --low:#7FCB9E; --medium:#6F93D6; --high:#E39A76;
    --low-light:rgba(127,203,158,.14); --medium-light:rgba(143,174,224,.16); --high-light:rgba(227,154,118,.14);
    --gold:#E0B84D; --gold-light:rgba(224,184,77,.16);
    color-scheme: dark;
  }
  body{transition:background-color .2s ease, color .2s ease;}
  *{box-sizing:border-box;}
  html{overscroll-behavior-y:none;scrollbar-gutter:stable;overflow-y:scroll;background:var(--bg);}
  body{margin:0;color:var(--ink);font-family:'Inter',sans-serif;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    background:var(--bg);min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;position:relative;z-index:1;}

  .background{position:fixed; inset:0; z-index:-1; overflow:hidden; background: var(--bg-radial); transition: background .2s ease;}
  .background::before{content:""; position:absolute; width:550px; height:550px; top:-180px; left:-120px; background:var(--blob1); border-radius:50%; filter:blur(90px);}
  .background::after{content:""; position:absolute; width:500px; height:500px; bottom:-160px; right:-100px; background:var(--blob2); border-radius:50%; filter:blur(110px);}

  .auth-box, .item-menu, .tab-btn.active, .day-card, .card, .modal, .confirm-box, .toast{
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    box-shadow: var(--glass-shadow);
  }
  .modal-overlay, .confirm-modal, .item-menu-overlay, .picker-overlay{
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .btn-cancel{
    background:var(--glass-btn-bg) !important;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border:1px solid var(--glass-btn-border) !important;
    transition:background .35s, transform .35s, border-color .35s;
  }
  .btn-cancel:hover{background:var(--glass-btn-bg-hover) !important; transform:translateY(-3px);}

  @keyframes cardIn{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

  /* ---- Auth screen (спільний з іншими модулями) ---- */
  #authScreen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none;opacity:.55;}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;}
  .auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--accent);}
  .auth-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}
  .lang-row{display:flex;justify-content:center;gap:6px;margin-top:20px;}
  .lang-chip{padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);}
  .lang-chip.selected{background:var(--accent-light);color:var(--accent);border-color:transparent;font-weight:600;}

  /* ---- Main app ---- */
  #appScreen{display:none;}
  /* ---- Шапка модуля ---- */
  /* Той самий напис, що й на головній, тільки менший: одна впізнавана
     позначка «де я» замість іконки з дрібним підписом. */
  .app-topbar{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 20px 10px;}
  .app-topbar-brand{font-family:'Inter',sans-serif;font-size:30px;font-weight:900;letter-spacing:-0.04em;
    line-height:1;color:var(--ink);text-decoration:none;}
  .item-menu-overlay{position:fixed;inset:0;z-index:55;display:none;}
  .item-menu-overlay.show{display:block;}
  .content{padding:14px 20px 0;}

  /* ---- Tabs ---- */
  .tab-row{display:flex;gap:6px;margin-bottom:16px;background:var(--glass-btn-bg);border:1px solid var(--border);
    border-radius:14px;padding:4px;}
  .tab-btn{flex:1;padding:9px 0;border-radius:11px;border:none;background:none;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink-muted);transition:background .2s,color .2s;}
  .tab-btn.active{background:var(--surface);color:var(--ink);}

  /* ---- Session list ---- */
  .day-group{margin-bottom:18px;}
  .day-label{display:flex;align-items:baseline;gap:6px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;padding-left:2px;}
  .session-card{background:var(--surface);border-radius:20px;border:1px solid var(--border);padding:14px 16px;
    margin-bottom:10px;cursor:pointer;transition:transform .15s;animation:cardIn .5s ease forwards;}
  .session-card:active{transform:scale(.985);}
  .session-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .session-name{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--ink);}
  .session-meta{font-size:11.5px;color:var(--ink-muted);font-weight:600;white-space:nowrap;}
  .session-ex-list{display:flex;flex-direction:column;gap:4px;}
  .session-ex-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-soft);}
  .session-ex-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .session-ex-best{color:var(--ink-muted);white-space:nowrap;flex-shrink:0;}
  .session-more{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .empty-state{text-align:center;padding:56px 20px;color:var(--ink-muted);}
  .empty-state .title{font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .empty-state svg{margin-bottom:14px;opacity:.5;}

  /* ---- Нижня панель навігації (та сама, що в «Бюджеті») ---- */
  /* Групи ліворуч і праворуч однакової ширини, тож кругла кнопка «+» завжди
     рівно посередині, скільки б вкладок не було в модулі. */
  .bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;
    max-width:400px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:7px 4px;background:var(--surface);
    backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    border:1px solid var(--border);border-radius:26px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.16);}
  .bn-side{flex:1;min-width:0;display:flex;justify-content:space-around;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:6px 1px;border-radius:14px;
    text-decoration:none;-webkit-tap-highlight-color:transparent;min-width:0;}
  .bn-item svg{flex-shrink:0;transition:transform .12s ease;}
  .bn-item span{font-size:10px;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .bn-item.active{color:var(--accent);}
  .bn-item.active svg{transform:translateY(-1px);}
  .bn-fab-wrap{flex:0 0 auto;width:54px;display:flex;justify-content:center;position:relative;}
  .bn-fab{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(92,124,250,.4), 0 2px 8px rgba(20,20,24,.12);transition:transform .15s ease;}
  .bn-fab:active{transform:translateX(-50%) scale(.92);}

  /* ---- PR / Records tab ---- */
  .muscle-group{margin-bottom:18px;}
  .muscle-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;padding-left:2px;}
  .pr-card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;}
  .pr-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--border);cursor:pointer;}
  .pr-row:first-child{border-top:none;}
  .pr-row:hover{background:var(--bg);}
  .pr-icon{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--gold-light);color:var(--gold);
    display:flex;align-items:center;justify-content:center;}
  .pr-body{flex:1;min-width:0;}
  .pr-name{font-size:14px;font-weight:600;color:var(--ink);}
  .pr-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .pr-value{text-align:right;flex-shrink:0;}
  .pr-weight{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
  .pr-trend{font-size:11px;font-weight:600;white-space:nowrap;}
  .pr-trend.up{color:var(--income);}
  .pr-trend.flat{color:var(--ink-muted);}

  /* ---- Toast (PR celebration) ---- */
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 18px;
    display:none;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink);
    animation:toastIn .3s ease forwards;box-shadow:0 10px 30px rgba(0,0,0,.16);max-width:calc(100% - 40px);}
  .toast.show{display:flex;}
  .toast .icon{color:var(--gold);flex-shrink:0;}

  /* ---- Modal (session form) ---- */
  .card{position:relative;background:var(--card-bg);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--card-border);border-radius:24px;padding:22px;margin-bottom:16px;overflow:hidden;
    transition:transform .35s, border-color .35s, box-shadow .35s;animation:cardIn .6s ease forwards;}
  .card::before{content:""; position:absolute; inset:0; background:var(--card-glare); pointer-events:none;}

  .modal-overlay, .picker-overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .picker-overlay{z-index:65;}
  .modal-overlay.show, .picker-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  /* ---- Кастомний datepicker (замінює нативний календар браузера) ---- */
  .dp-field{position:relative;margin-top:6px;margin-bottom:16px;}
  input[data-dp-native]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .dp-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-family:'Inter',sans-serif;font-size:15.5px;text-align:left;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink);
    cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .dp-trigger:hover, .dp-trigger:focus-visible{border-color:var(--accent);}
  .dp-field.open .dp-trigger{border-color:var(--accent);}
  .dp-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dp-trigger-text.dp-placeholder{color:var(--ink-muted);}
  .dp-trigger-icon{flex-shrink:0;color:var(--ink-muted);display:flex;}
  .dp-panel{position:fixed;z-index:55;width:280px;max-width:calc(100vw - 32px);
    background:var(--surface);backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    border:1px solid var(--border);border-radius:18px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.18);
    padding:14px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .14s ease,transform .14s ease;}
  .dp-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-head-label{font-size:14px;font-weight:600;color:var(--ink);text-transform:capitalize;}
  .dp-nav-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dp-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .dp-weekday{font-size:11px;font-weight:600;color:var(--ink-muted);text-align:center;padding:4px 0;text-transform:uppercase;}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);background:transparent;border:none;border-radius:50%;
    cursor:pointer;}
  .dp-day:hover:not(:disabled):not(.dp-day-selected){background:var(--accent-light);}
  .dp-day.dp-day-muted{color:var(--ink-muted);opacity:.45;}
  .dp-day.dp-day-today:not(.dp-day-selected)::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .dp-day.dp-day-selected{background:var(--accent);color:#fff;font-weight:600;}
  .dp-day:disabled{opacity:.28;cursor:default;}
  .dp-foot{display:flex;align-items:center;justify-content:flex-start;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .dp-today-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;}
  .dp-today-btn:hover{text-decoration:underline;}
  .modal-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;}
  .close-btn{background:none;border:none;cursor:pointer;color:var(--ink-muted);}
  label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .title-input{width:100%;font-family:'Inter',sans-serif;font-size:20px;font-weight:700;border:none;
    border-bottom:2px solid var(--border);padding:8px 0;margin-bottom:16px;outline:none;background:transparent;color:var(--ink);}
  .title-input:focus{border-color:var(--accent);}
  input[type=date], input[type=time], input[type=text], input[type=number], input[type=search], textarea, select{width:100%;font-family:'Inter',sans-serif;font-size:15.5px;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-top:6px;margin-bottom:16px;outline:none;color:var(--ink);background:var(--bg);}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;min-width:0;}
  .form-error{color:var(--expense);font-size:13px;margin-bottom:8px;}
  .submit-btn{width:100%;margin-top:4px;padding:13px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;
    font-size:15px;font-weight:600;font-family:'Inter',sans-serif;background:var(--accent);}
  .submit-btn:disabled{opacity:.55;cursor:default;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions .submit-btn{margin-top:0;flex:1;}
  .btn-delete{border:none;background:var(--expense);color:#fff;font-weight:500;border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;}

  .confirm-modal{position:fixed;inset:0;background:rgba(34,38,43,.32);display:none;align-items:center;justify-content:center;z-index:75;padding:20px;}
  .confirm-modal.show{display:flex;}
  .confirm-box{background:var(--surface);border-radius:22px;padding:22px;max-width:340px;width:100%;}
  .confirm-title{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;margin-bottom:6px;}
  .confirm-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;}
  .btn-cancel{border:1px solid var(--border);background:transparent;color:var(--ink-soft);}

  /* ---- Exercise blocks inside the workout form ---- */
  .ex-block{background:var(--surface-flat);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:12px;}
  .ex-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .ex-block-name{font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;color:var(--ink);}
  .ex-block-muscle{font-size:11px;color:var(--ink-muted);margin-bottom:8px;}
  .ex-remove-btn{background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:4px;flex-shrink:0;}
  .ex-remove-btn:hover{color:var(--expense);}
  .set-hint{font-size:11.5px;color:var(--ink-muted);margin-bottom:6px;}
  .set-row{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:6px;}
  .set-num{font-size:12px;font-weight:700;color:var(--ink-muted);text-align:center;}
  .set-row input{margin:0;padding:8px 10px;font-size:14.5px;}
  .set-remove{background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;}
  .set-remove:hover{color:var(--expense);}
  .add-set-btn{background:none;border:1px dashed var(--border);color:var(--accent);border-radius:9px;padding:7px 10px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;width:100%;margin-top:2px;}
  .add-ex-btn{background:var(--glass-btn-bg);border:1px solid var(--glass-btn-border);color:var(--accent);border-radius:12px;
    padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;width:100%;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .add-ex-btn:hover{background:var(--glass-btn-bg-hover);}

  /* ---- Exercise picker sheet ---- */
  .picker-modal{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));
    width:100%;max-width:480px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .picker-group{margin-bottom:14px;}
  .picker-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin-bottom:6px;padding-left:2px;}
  .picker-item{padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--ink);}
  .picker-item:hover{background:var(--bg);}
  .picker-custom-row{display:flex;gap:8px;align-items:flex-start;margin-top:4px;}
  .picker-custom-row input{margin-bottom:0;}
  .picker-custom-row button{flex-shrink:0;padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;
    font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;}

  /* ---- Exercise history sheet ---- */
  .hist-summary{display:flex;gap:10px;margin-bottom:16px;}
  .hist-stat{flex:1;background:var(--surface-flat);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;}
  .hist-stat-value{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;color:var(--ink);}
  .hist-stat-label{font-size:10.5px;color:var(--ink-muted);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}
  .hist-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--border);}
  .hist-row:first-child{border-top:none;}
  .hist-date{font-size:12.5px;color:var(--ink-muted);flex-shrink:0;width:78px;}
  .hist-sets{flex:1;font-size:13.5px;color:var(--ink);}
  .hist-badge{font-size:10.5px;font-weight:700;color:var(--gold);flex-shrink:0;margin-left:6px;}

  svg.icon{display:inline-block;vertical-align:middle;}

  @media (min-width:880px){
    body{padding-bottom:32px;}
    .wrap{max-width:none;margin:0;padding:0 40px;}
    .app-topbar{padding:28px 0 0;}
    .content{max-width:960px;margin:0 auto;padding:14px 4px 40px;}
    .bottom-nav{left:auto;right:32px;bottom:32px;margin:0;width:350px;}
    .modal-overlay, .picker-overlay{align-items:center;}
    .modal, .picker-modal{border-radius:18px;max-height:88vh;}
  }
</style>
</head>
<body>

<div class="background"></div>

<div id="authLoading" aria-hidden="true"><div class="spinner"></div></div>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B7A9D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3.4.5-4.5 2-1.1-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1.5 2 4 1.5-4.5 1.5 2h5.27"/></svg>
    </div>
    <div class="auth-title" id="authTitle">Вхід</div>
    <div class="auth-sub" id="authSub">Увійди, щоб дані синхронізувались між твоїми пристроями.</div>
    <form id="authForm" autocomplete="on">
      <label class="field-label" id="authEmailLabel">Email</label>
      <input type="email" id="authEmail" name="email" autocomplete="username">
      <label class="field-label" id="authPasswordLabel">Пароль</label>
      <input type="password" id="authPassword" name="password" autocomplete="current-password">
      <div class="auth-hint" id="authPasswordHint" style="display:none;font-size:12px;color:var(--ink-muted);margin:4px 0 12px;">Мінімум 6 символів</div>
      <div class="auth-options-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked>
          <span id="rememberMeLabel">Запам'ятати мене</span>
        </label>
        <a id="forgotPasswordLink">Забув(ла) пароль?</a>
      </div>
      <div class="auth-error" id="authError" role="alert" aria-live="assertive"></div>
      <div class="auth-info" id="authInfo"></div>
      <button class="auth-submit" id="authSubmit" type="submit">Увійти</button>
    </form>
    <div class="auth-switch" id="authSwitch">Ще немає акаунта? <a id="authToggle">Зареєструватися</a></div>
    <div class="lang-row" id="authLangRow"></div>
  </div>
</div>

<div id="appScreen">
<div class="wrap" id="wrap">
  <div class="app-topbar">
    <a href="../index.html" class="app-topbar-brand" id="topbarHomeLink" aria-label="На головну">Life</a>
  </div>

  <div class="content">
    <div id="sessionsTab"></div>
    <div id="recordsTab" style="display:none;"></div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <div class="bn-side">
      <button type="button" class="bn-item active" data-tab="sessions" id="bnSessions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="10" width="1.8" height="4" rx=".9"/><rect x="2.6" y="7.2" width="2.8" height="9.6" rx="1.4"/><rect x="5.2" y="5.5" width="3.4" height="13" rx="1.7"/><path d="M8.6 12h6.8"/><rect x="15.4" y="5.5" width="3.4" height="13" rx="1.7"/><rect x="18.6" y="7.2" width="2.8" height="9.6" rx="1.4"/><rect x="21.2" y="10" width="1.8" height="4" rx=".9"/></svg>
        <span id="bnSessionsLabel">Тренування</span>
      </button>
    </div>
    <div class="bn-fab-wrap">
      <button type="button" class="bn-fab" id="newSessionBtn" aria-label="Нове тренування">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="bn-side">
      <button type="button" class="bn-item" data-tab="records" id="bnRecords">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <span id="bnRecordsLabel">Рекорди</span>
      </button>
    </div>
  </nav>
</div>
</div>

<div class="toast" id="prToast"><span class="icon" aria-hidden="true">🏆</span><span id="prToastText"></span></div>

<!-- ---- Форма тренування (створення / редагування) ---- -->
<div class="modal-overlay" id="sessionFormOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="sessionModalTitle">Нове тренування</div>
      <button class="close-btn" id="closeSessionForm" aria-label="Закрити"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <form id="sessionForm">
      <input type="text" id="sessionNameInput" class="title-input" placeholder="Назва (необовʼязково)" maxlength="120">
      <div class="field-row">
        <div>
          <label class="field-label" id="sessionDateLabel">Дата</label>
          <input type="date" id="sessionDateInput" data-dp-native>
        </div>
      </div>

      <label class="field-label" id="exercisesLabel" style="margin-bottom:8px;">Вправи</label>
      <div id="exerciseBlocks"></div>
      <button type="button" class="add-ex-btn" id="addExerciseBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span id="addExerciseLabel">Додати вправу</span>
      </button>

      <label class="field-label" id="sessionNotesLabel" style="margin-top:14px;">Нотатка</label>
      <textarea id="sessionNotesInput" maxlength="3000"></textarea>

      <div class="form-error" id="sessionFormError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="deleteSessionBtn" style="display:none;">Видалити</button>
        <button class="submit-btn" id="sessionSubmitBtn" type="submit">Зберегти</button>
      </div>
    </form>
  </div>
</div>

<!-- ---- Вибір вправи (бібліотека + власна назва) ---- -->
<div class="picker-overlay" id="exercisePickerOverlay">
  <div class="picker-modal">
    <div class="modal-head">
      <div class="modal-title" id="pickerTitle">Обрати вправу</div>
      <button class="close-btn" id="closePicker" aria-label="Закрити"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <input type="search" id="pickerSearch" placeholder="" style="margin-bottom:14px;">
    <div id="pickerGroups"></div>
    <div class="picker-group">
      <div class="picker-group-label" id="pickerCustomLabel">Своя вправа</div>
      <div class="picker-custom-row">
        <input type="text" id="pickerCustomInput" maxlength="120" placeholder="" style="margin:0;">
        <button type="button" id="pickerCustomAdd"></button>
      </div>
    </div>
  </div>
</div>

<!-- ---- Історія вправи (рекорди/прогресія) ---- -->
<div class="modal-overlay" id="historyOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="historyTitle">Вправа</div>
      <button class="close-btn" id="closeHistory" aria-label="Закрити"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="hist-summary" id="historySummary"></div>
    <div id="historyList"></div>
  </div>
</div>

<!-- ---- Підтвердження видалення ---- -->
<div class="confirm-modal" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Видалити тренування?</div>
    <div class="confirm-sub" id="confirmSub">Цю дію не можна скасувати.</div>
    <div class="confirm-actions">
      <button class="btn-cancel" id="confirmCancel">Скасувати</button>
      <button class="btn-delete" id="confirmDelete">Видалити</button>
    </div>
  </div>
</div>

<script src="../budget/firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
  :root{
    --bg:#EDEEF3;
    --bg-radial: radial-gradient(circle at top, #ffffff 0%, #eceef4 45%, #dfe1ea 100%);
    /* Колір смуги над сторінкою — області статус-бару в standalone на iOS.
       Шар із градієнтом (.background) туди НЕ дістає: у встановленому
       застосунку він розтягується на viewport, а смуга статус-бару лежить
       поза ним. Малює її тло html, тож воно й мусить дорівнювати ПОЧАТКУ
       --bg-radial над ним — інакше вгорі видно шов. Знизу градієнт дістає,
       тому там нічого міняти не треба. */
    --status-bar: #ffffff;
    --blob1:#ffffffb0; --blob2:#8fa6e070;
    --surface:linear-gradient(155deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
    --surface-flat: rgba(255,255,255,.5);
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:rgba(255,255,255,.55); --income:#4F9C74; --income-light:rgba(79,156,116,.14); --expense:#C9683F; --expense-light:rgba(201,104,63,.13); --accent:#4A6FA5; --accent-light:rgba(74,111,165,.13);
    --control-bg:rgba(255,255,255,.35); --overlay:rgba(30,32,40,.28);
    --glass-blur:22px; --glass-shadow:0 8px 32px rgba(40,44,70,.10), inset 0 1px 0 rgba(255,255,255,.6);
    --card-bg: rgba(20,25,40,.035); --card-border: rgba(20,25,40,.10); --card-border-hover: rgba(20,25,40,.22);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(20,25,40,.10), 0 0 60px rgba(20,25,40,.05);
    --glass-btn-bg: rgba(20,25,40,.05); --glass-btn-bg-hover: rgba(20,25,40,.09); --glass-btn-border: rgba(20,25,40,.16);
    --gold:#B8912F; --gold-light:rgba(184,145,47,.14);
    --cat-health:#3F9C8C; --cat-health-light:rgba(63,156,140,.14);
    --cat-finance:#B98B2E; --cat-finance-light:rgba(185,139,46,.14);
    --cat-learning:#6A5FC1; --cat-learning-light:rgba(106,95,193,.14);
    --cat-career:#48607E; --cat-career-light:rgba(72,96,126,.14);
    --cat-relationships:#C3527A; --cat-relationships-light:rgba(195,82,122,.14);
    --cat-travel:#2E93A6; --cat-travel-light:rgba(46,147,166,.14);
    --cat-creativity:#9C4FB0; --cat-creativity-light:rgba(156,79,176,.14);
    --cat-other:#6E6E78; --cat-other-light:rgba(110,110,120,.14);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0B0B0E;
    --bg-radial: radial-gradient(circle at top, #353535 0%, #181818 45%, #0d0d0d 100%);
    --status-bar: #353535;
    --blob1:#ffffff15; --blob2:#c48fe040;
    --surface:linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    --surface-flat: rgba(255,255,255,.06);
    --ink:#EFEEF3; --ink-soft:#C4C2CE; --ink-muted:#8E8C99;
    --border:rgba(255,255,255,.12); --income:#7FCB9E; --income-light:rgba(127,203,158,.14); --expense:#E39A76; --expense-light:rgba(227,154,118,.14);
    --accent:#6F93D6; --accent-light:rgba(143,174,224,.16); --control-bg:rgba(255,255,255,.05); --overlay:rgba(0,0,0,.55);
    --glass-blur:22px; --glass-shadow:0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    --card-bg: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.12); --card-border-hover: rgba(255,255,255,.25);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(255,255,255,.08), 0 0 60px rgba(255,255,255,.04);
    --glass-btn-bg: rgba(255,255,255,.08); --glass-btn-bg-hover: rgba(255,255,255,.16); --glass-btn-border: rgba(255,255,255,.18);
    --gold:#E8C875; --gold-light:rgba(232,200,117,.16);
    --cat-health:#6FCBBC; --cat-health-light:rgba(111,203,188,.16);
    --cat-finance:#E3B95C; --cat-finance-light:rgba(227,185,92,.16);
    --cat-learning:#A79BEF; --cat-learning-light:rgba(167,155,239,.16);
    --cat-career:#8FB0D6; --cat-career-light:rgba(143,176,214,.16);
    --cat-relationships:#EF9AC0; --cat-relationships-light:rgba(239,154,192,.16);
    --cat-travel:#6FD6EA; --cat-travel-light:rgba(111,214,234,.16);
    --cat-creativity:#D89AE8; --cat-creativity-light:rgba(216,154,232,.16);
    --cat-other:#A9A7B4; --cat-other-light:rgba(169,167,180,.16);
    color-scheme: dark;
  }
  body{transition:color .2s ease;}
  *{box-sizing:border-box;}
  /* scrollbar-gutter лишається — він тримає ширину сторінки незмінною на
     комп'ютері. А от overflow-y:scroll малював смугу навіть тоді, коли
     гортати нічого. */
  /* Колір тла живе ТІЛЬКИ тут: html малює полотно сторінки (і те, що видно
     під час overscroll). У body його бути не повинно — див. .background. */
  html{overscroll-behavior-y:none;scrollbar-gutter:stable;background:var(--status-bar);
    transition:background-color .2s ease;}
  body{margin:0;color:var(--ink);font-family:'Inter',sans-serif;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    min-height:100vh; min-height:100svh;}
  .wrap{max-width:480px;margin:0 auto;position:relative;z-index:1;}

  /* Шар лежить під вмістом (z-index:-1), і саме тому в body НЕ МОЖЕ бути
     власного тла: body — звичайний потоковий нащадок html, а потокові
     нащадки малюються ПІСЛЯ відʼємних z-index. Непрозоре тло body
     зафарбовувало і градієнт, і обидві плями повністю. */
  .background{position:fixed; inset:0; z-index:-1; overflow:hidden; background: var(--bg-radial); transition: background .2s ease;}
  .background::before{content:""; position:absolute; width:550px; height:550px; top:-180px; left:-120px; background:var(--blob1); border-radius:50%; filter:blur(90px);}
  .background::after{content:""; position:absolute; width:500px; height:500px; bottom:-160px; right:-100px; background:var(--blob2); border-radius:50%; filter:blur(110px);}

  .auth-box, .goal-menu, .card, .modal, .confirm-box{
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    box-shadow: var(--glass-shadow);
  }
  .modal-overlay, .confirm-modal{
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .btn-cancel{
    background:var(--glass-btn-bg) !important;
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border:1px solid var(--glass-btn-border) !important;
    transition:background .35s, transform .35s, border-color .35s;
  }
  .btn-cancel:hover{background:var(--glass-btn-bg-hover) !important; transform:translateY(-3px);}

  @keyframes cardIn{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Auth screen (ідентично іншим модулям) ---- */
  #authScreen{display:none;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none;opacity:.55;}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;}
  .auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--accent);}
  .auth-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}
  .lang-row{display:flex;justify-content:center;gap:6px;margin-top:20px;}
  .lang-chip{padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);}
  .lang-chip.selected{background:var(--accent-light);color:var(--accent);border-color:transparent;font-weight:600;}

  /* ---- Main app ---- */
  #appScreen{display:none;}
  /* ---- Шапка модуля ---- */
  /* Той самий напис, що й на головній, тільки менший: одна впізнавана
     позначка «де я» замість іконки з дрібним підписом. */
  .app-topbar{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 20px 10px;}
  .topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .app-topbar-brand{font-family:'Inter',sans-serif;font-size:30px;font-weight:900;letter-spacing:-0.04em;
    line-height:1;color:var(--ink);text-decoration:none;}
  .content{padding:20px 20px 0;}

  /* ---- Dashboard ---- */
  .badges-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .badge-chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--gold-light);color:var(--gold);white-space:nowrap;}

  .status-filter-row, .tag-filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .tag-filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);white-space:nowrap;}
  .tag-filter-chip.selected{background:var(--accent-light);color:var(--accent);border-color:transparent;font-weight:600;}

  /* Повернення після перерви. Кольори теплі, а не тривожні: це не помилка
     й не борг, це момент, у який людина прийшла назад. */
  .lapse{background:var(--gold-light);border-radius:16px;padding:14px;margin-bottom:14px;}
  .lapse-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .lapse-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-bottom:11px;}
  .lapse-actions{display:flex;flex-wrap:wrap;gap:6px;}
  .lapse-btn{cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:8px 13px;border-radius:10px;white-space:nowrap;
    border:1px solid var(--border);background:var(--surface-flat);color:var(--ink-soft);}
  .lapse-btn.primary{background:var(--gold);border-color:transparent;color:#fff;}
  .review-lapse{margin-top:8px;font-size:12px;font-weight:600;color:var(--gold);}

  /* Число просто у вечірній картці: «+3 км» не має вимагати заходу в розділ. */
  .evening-amount{display:flex;gap:6px;margin-top:8px;}
  .evening-amount input{flex:1;min-width:0;padding:8px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface-flat);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13.5px;}
  .evening-amount .evening-btn{flex:0 0 auto;min-width:46px;font-size:16px;font-weight:700;}

  /* Намір «якщо ситуація — то дія». Дві половини стоять поруч саме тому,
     що поодинці жодна з них наміром не є. */
  .plan-fields{display:flex;flex-direction:column;gap:6px;}
  .plan{background:var(--accent-light);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
  .plan-label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:5px;}
  .plan-text{font-size:14px;color:var(--ink);line-height:1.45;}
  .plan-text b{font-weight:700;}
  .evening-plan{margin:6px 0 8px;font-size:12.5px;color:var(--accent);line-height:1.45;}
  .review-plan{margin-top:8px;font-size:12.5px;color:var(--accent);line-height:1.45;}

  /* Ціль, яку нема чим міряти. Тон спокійний: це пропущений крок
     постановки, а не провина. */
  .measure-banner{background:var(--gold-light);border-radius:14px;padding:13px 14px;margin-bottom:14px;}
  .measure-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .measure-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-bottom:10px;}
  .measure-banner button{cursor:pointer;border:none;font-family:'Inter',sans-serif;font-size:12.5px;
    font-weight:600;padding:8px 14px;border-radius:10px;background:var(--gold);color:#fff;}
  .review-measure{margin-top:8px;font-size:12px;font-weight:600;color:var(--gold);}

  /* Крок тижня: огляд закінчується дією, а не лише рішенням про долю цілі. */
  .review-step{display:flex;gap:6px;margin:12px 0 10px;}
  .review-step input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-flat);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;}

  /* Скільки разів дедлайн уже їхав. Тон рівний: це факт, а не докір. */
  .drift{margin:-6px 0 14px;font-size:11.5px;color:var(--ink-muted);line-height:1.45;}

  /* Графік прогресу: темп називає підсумок, а лінія показує форму шляху. */
  .chart{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:14px 14px 10px;margin-bottom:14px;}
  .chart-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .chart-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);}
  .chart-now{font-size:13px;font-weight:700;color:var(--ink);}
  .chart svg{display:block;width:100%;height:78px;overflow:visible;}
  .chart-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
    vector-effect:non-scaling-stroke;}
  .chart-area{fill:var(--accent-light);stroke:none;}
  .chart-required{fill:none;stroke:var(--ink-muted);stroke-width:1.5;stroke-dasharray:4 4;
    opacity:.7;vector-effect:non-scaling-stroke;}
  .chart-axis{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;}
  .chart-dot{fill:var(--accent);}
  .chart-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;
    font-size:11px;color:var(--ink-muted);}
  .chart-legend{display:flex;align-items:center;gap:5px;}
  .chart-legend i{display:inline-block;width:14px;height:0;border-top:1.5px dashed var(--ink-muted);opacity:.7;}

  /* Віха -> завдання: крок нарешті потрапляє туди, куди дивляться щодня. */
  .journey-task-btn{align-self:center;cursor:pointer;border:1px solid var(--border);
    background:transparent;color:var(--ink-muted);font-family:'Inter',sans-serif;font-size:11.5px;
    font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .journey-task-btn:hover{color:var(--accent);border-color:var(--accent);}
  .journey-task-mark{align-self:center;font-size:11.5px;font-weight:600;
    color:var(--accent);white-space:nowrap;}

  /* Ретроспектива: єдине місце, де закрита ціль лишає слід на екрані. */
  .retro{margin-bottom:14px;}
  .retro-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .retro-count{font-size:15px;font-weight:700;color:var(--ink);}
  .retro-span{font-size:12.5px;color:var(--ink-muted);}
  .retro-periods{display:flex;gap:6px;margin-bottom:12px;}
  .goal-card-days{color:var(--ink-muted);}

  .category-chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .category-chip.health{background:var(--cat-health-light);color:var(--cat-health);}
  .category-chip.finance{background:var(--cat-finance-light);color:var(--cat-finance);}
  .category-chip.learning{background:var(--cat-learning-light);color:var(--cat-learning);}
  .category-chip.career{background:var(--cat-career-light);color:var(--cat-career);}
  .category-chip.relationships{background:var(--cat-relationships-light);color:var(--cat-relationships);}
  .category-chip.travel{background:var(--cat-travel-light);color:var(--cat-travel);}
  .category-chip.creativity{background:var(--cat-creativity-light);color:var(--cat-creativity);}
  .category-chip.other{background:var(--cat-other-light);color:var(--cat-other);}

  .category-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;margin-bottom:16px;}
  .category-choice{padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
  .category-choice.selected.health{background:var(--cat-health-light);color:var(--cat-health);border-color:transparent;}
  .category-choice.selected.finance{background:var(--cat-finance-light);color:var(--cat-finance);border-color:transparent;}
  .category-choice.selected.learning{background:var(--cat-learning-light);color:var(--cat-learning);border-color:transparent;}
  .category-choice.selected.career{background:var(--cat-career-light);color:var(--cat-career);border-color:transparent;}
  .category-choice.selected.relationships{background:var(--cat-relationships-light);color:var(--cat-relationships);border-color:transparent;}
  .category-choice.selected.travel{background:var(--cat-travel-light);color:var(--cat-travel);border-color:transparent;}
  .category-choice.selected.creativity{background:var(--cat-creativity-light);color:var(--cat-creativity);border-color:transparent;}
  .category-choice.selected.other{background:var(--cat-other-light);color:var(--cat-other);border-color:transparent;}
  /* Прості вибори з двох-трьох варіантів (горизонт, скарбничка) — та сама
     форма чипа, але без кольорів сфер життя: тут вони нічого не означали б. */
  .choice-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;margin-bottom:6px;}
  .choice{padding:6px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;}
  .choice.selected{background:var(--accent);color:#fff;border-color:transparent;}

  .card{position:relative;background:var(--card-bg);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--card-border);border-radius:24px;padding:22px;margin-bottom:16px;overflow:hidden;
    transition:transform .35s, border-color .35s, box-shadow .35s;animation:cardIn .6s ease forwards;}
  .card::before{content:""; position:absolute; inset:0; background:var(--card-glare); pointer-events:none;}

  .goal-card{cursor:pointer;}
  .goal-card:hover{border-color:var(--card-border-hover);}
  .goal-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;}
  .goal-card-title{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;margin:0 0 6px;position:relative;}
  .goal-card-status-badge{flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-muted);background:var(--glass-btn-bg);border:1px solid var(--glass-btn-border);padding:4px 9px;border-radius:999px;}
  .goal-mini-progress{height:6px;border-radius:3px;background:var(--surface-flat);overflow:hidden;margin-top:12px;position:relative;}
  .goal-mini-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}
  .goal-card-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-muted);position:relative;}
  .goal-streak-flame{color:var(--expense);font-weight:700;}
  .goal-card-deadline.overdue{color:var(--expense);font-weight:600;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-muted);}
  .empty-state .title{font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}

  /* ---- Нижня панель навігації (та сама, що в «Бюджеті») ---- */
  /* Групи ліворуч і праворуч однакової ширини, тож кругла кнопка «+» завжди
     рівно посередині, скільки б вкладок не було в модулі. */
  .bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;
    max-width:400px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:7px 4px;background:var(--surface);
    backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    border:1px solid var(--border);border-radius:26px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.16);}
  .bn-side{flex:1;min-width:0;display:flex;justify-content:space-around;}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:6px 1px;border-radius:14px;
    text-decoration:none;-webkit-tap-highlight-color:transparent;min-width:0;}
  .bn-item svg{flex-shrink:0;transition:transform .12s ease;}
  .bn-item span{font-size:10px;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .bn-item.active{color:var(--accent);}
  .bn-item.active svg{transform:translateY(-1px);}
  /* «Плюс» більше не сидить усередині меню. Тепер праворуч виростає
     стовпчик: помічник згори, під ним додавання, під ними — самі вкладки.
     Меню від цього стає тим, чим і має бути: рядком сторінок без чужої
     кнопки посередині.
     Відступ знизу — висота меню (62px) плюс його власний відступ і просвіт;
     (помічник переїхав у шапку — див. .ai-topbar-btn в ai-chat.css). */
  .bn-fab{position:fixed;right:var(--fab-right, 14px);
    bottom:calc(var(--fab-bottom, 86px) + env(safe-area-inset-bottom));z-index:26;
    width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(92,124,250,.4), 0 2px 8px rgba(20,20,24,.12);transition:transform .15s ease;
    -webkit-tap-highlight-color:transparent;}
  .bn-fab:active{transform:scale(.92);}

  /* ---- Деталі цілі ---- */
  #goalDetailScreen{display:none;padding:16px 20px 40px;}
  .detail-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .cal-nav-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;
    border-radius:50%;border:1px solid var(--border);background:var(--glass-btn-bg);color:var(--ink-soft);
    cursor:pointer;transition:background .2s;}
  .cal-nav-btn:hover{background:var(--glass-btn-bg-hover);}
  .detail-title{flex:1;min-width:0;text-align:center;font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .detail-badges-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;}
  .why-block{background:var(--accent-light);border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:14px;color:var(--ink-soft);line-height:1.5;font-style:italic;}

  .progress-ring{position:relative;width:112px;height:112px;border-radius:50%;margin:0 auto 20px;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--card-border) 0);}
  .progress-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg);}
  .progress-ring-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .progress-ring-pct{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .progress-ring-frac{font-size:11px;color:var(--ink-muted);}

  .journey{display:flex;flex-direction:column;margin-bottom:20px;}
  .journey-stop{position:relative;display:grid;grid-template-columns:28px 1fr auto;column-gap:14px;padding-bottom:20px;cursor:pointer;}
  .journey-stop:last-child{padding-bottom:0;}
  .journey-stop::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--border);}
  .journey-stop:last-child::before{display:none;}
  .journey-stop.done::before{background:var(--income);}
  .journey-node{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);
    background:var(--surface-flat);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
    cursor:pointer;padding:0;}
  .journey-node svg{display:none;width:14px;height:14px;}
  .journey-stop.done .journey-node{background:var(--income);border-color:var(--income);}
  .journey-stop.done .journey-node svg{display:block;}
  .journey-stop.next .journey-node{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-light);}
  .journey-label{align-self:center;font-size:14.5px;color:var(--ink);line-height:1.4;padding-top:2px;}
  .journey-stop.done .journey-label{color:var(--ink-muted);text-decoration:line-through;}
  .journey-next-badge{margin-left:6px;font-size:10px;font-weight:700;color:var(--accent);
    background:var(--accent-light);border-radius:10px;padding:2px 8px;white-space:nowrap;text-decoration:none;display:inline-block;}

  .all-done-banner{background:var(--income-light);color:var(--income);border-radius:16px;padding:14px 16px;margin-bottom:18px;
    font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .all-done-banner button{flex-shrink:0;border:none;background:var(--income);color:#fff;font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;}

  /* Рятунок серії: попередження, а не свято, — тому теплий колір
     видатків, а не зелений. Кнопка поруч, щоб рішення було одним дотиком. */
  .rescue-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:var(--expense-light);color:var(--expense);border-radius:16px;padding:12px 16px;margin-bottom:12px;
    font-size:13.5px;font-weight:600;line-height:1.45;text-align:center;}
  .rescue-banner button{flex-shrink:0;border:none;background:var(--expense);color:#fff;font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;}
  .rescue-banner button:active{transform:scale(.96);}
  .rescue-banner.waiting{background:var(--surface-flat);color:var(--ink-muted);}

  /* Темп: чи встигаєш до дедлайну. Колір несе вердикт, тож він і головний —
     «не встигаєш» має читатись до того, як людина дочитає речення. */
  .pace{border-radius:16px;padding:12px 14px;margin-bottom:14px;background:var(--surface-flat);
    font-size:13.5px;line-height:1.45;}
  .pace-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);}
  .pace-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink-muted);}
  .pace-sub{margin-top:5px;color:var(--ink-muted);font-size:12.5px;}
  .pace.behind .pace-dot, .pace.overdue .pace-dot{background:var(--expense);}
  .pace.behind .pace-head, .pace.overdue .pace-head{color:var(--expense);}
  .pace.ahead .pace-dot, .pace.onTrack .pace-dot{background:var(--income);}
  .pace.ahead .pace-head, .pace.onTrack .pace-head{color:var(--income);}

  /* Пауза — тиха дія, тож і кнопка тиха: не червона й не на всю ширину. */
  .pause-row{display:flex;justify-content:center;margin-top:10px;}
  .pause-btn{border:1px solid var(--border);background:transparent;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:9px 16px;
    border-radius:999px;cursor:pointer;}
  .pause-btn:active{transform:scale(.97);}
  .paused-note{background:var(--surface-flat);color:var(--ink-muted);border-radius:14px;
    padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.45;text-align:center;}

  /* Огляд тижня. Той самий каркас, що й «розбір минулих днів» у завданнях:
     банер на дашборді, за ним екран, де кожен пункт треба вирішити. */
  .review-banner{display:flex;align-items:center;gap:10px;justify-content:space-between;
    background:var(--surface);border-radius:18px;padding:13px 16px;margin-bottom:14px;cursor:pointer;
    border:1px solid var(--border);}
  .review-banner-text{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4;}
  .review-banner-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .review-banner-go{flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;}
  #reviewScreen{display:none;padding:16px 20px 40px;}
  .review-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px;}
  .review-title{font-size:20px;font-weight:800;color:var(--ink);}
  .review-later{border:none;background:none;color:var(--ink-muted);font-family:'Inter',sans-serif;
    font-size:13px;cursor:pointer;padding:4px;}
  .review-sub{font-size:13px;color:var(--ink-muted);margin-bottom:16px;line-height:1.45;}
  .review-item{background:var(--surface);border-radius:18px;padding:15px 16px;margin-bottom:12px;}
  .review-item-title{font-size:15px;font-weight:700;color:var(--ink);line-height:1.35;}
  .review-why{margin-top:8px;padding-left:10px;border-left:2px solid var(--border);
    font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.45;}
  .review-moved{margin-top:10px;font-size:12.5px;color:var(--ink-muted);}
  .review-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .review-chip{background:var(--surface-flat);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-soft);}
  .review-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;}
  .review-btn{flex:1 1 45%;border:1px solid var(--border);background:transparent;color:var(--ink-soft);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:9px 6px;
    border-radius:12px;cursor:pointer;}
  .review-btn.primary{background:var(--accent);color:#fff;border-color:transparent;}
  .review-btn:active{transform:scale(.97);}
  .review-shift-row{display:flex;gap:7px;margin-top:9px;}
  .review-shift-row input{flex:1;}
  .review-empty{text-align:center;color:var(--ink-muted);font-size:13.5px;padding:30px 0;}

  /* Віхи у формі: ручка, поля, дата. Ручка ліворуч, а не праворуч поруч із
     хрестиком, — щоб «переставити» не плуталось із «видалити». */
  .milestone-editor-row.dragging{position:relative;z-index:2;opacity:.92;}
  .milestone-drag{flex-shrink:0;border:none;background:none;color:var(--ink-muted);
    cursor:grab;padding:6px 2px;touch-action:none;border-radius:8px;}
  .milestone-drag:focus-visible{outline:2px solid var(--accent);}
  .milestone-fields{flex:1;display:flex;gap:6px;min-width:0;}
  .milestone-fields input[type="text"]{flex:1;min-width:0;}
  .milestone-date{flex-shrink:0;width:140px;}
  .journey-due{margin-left:8px;font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
  .journey-due.overdue{color:var(--expense);font-weight:600;}

  .linked-note{margin-top:10px;font-size:12px;color:var(--ink-muted);text-align:center;line-height:1.4;}

  /* Що заважає найчастіше. Не докір, а спостереження: список причин, які
     людина сама назвала, зібраний за частотою. Тон навмисно нейтральний —
     сірий, дрібний, без червоного: це матеріал для висновку, а не вирок. */
  .blockers{background:var(--surface-flat);border-radius:14px;padding:11px 14px;margin-bottom:12px;}
  .blockers-title{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-muted);margin-bottom:7px;}
  .blockers-row{display:flex;flex-wrap:wrap;gap:6px;}
  .blocker-chip{display:inline-flex;align-items:baseline;gap:5px;background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-soft);}
  .blocker-count{font-size:11px;font-weight:700;color:var(--ink-muted);font-variant-numeric:tabular-nums;}
  .review-blockers{margin-top:9px;font-size:12px;color:var(--ink-muted);line-height:1.45;}

  /* Драбина місяць -> рік. На річній цілі — що на неї працює цього місяця;
     на місячній — кому вона служить. Обидва блоки навмисно тихі: це контекст,
     а не дія. */
  .parent-link{display:inline-flex;align-items:center;gap:7px;background:var(--surface-flat);
    border-radius:999px;padding:6px 13px;margin-bottom:12px;font-size:12.5px;
    color:var(--ink-soft);cursor:pointer;border:1px solid var(--border);}
  .parent-link-arrow{color:var(--ink-muted);}
  .children-block{background:var(--surface-flat);border-radius:14px;padding:11px 14px;margin-bottom:12px;}
  .children-title{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--ink-muted);margin-bottom:8px;}
  .child-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;}
  .child-title{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .child-pct{font-size:12px;font-weight:700;color:var(--ink-muted);font-variant-numeric:tabular-nums;flex-shrink:0;}
  .child-row.done .child-title{text-decoration:line-through;color:var(--ink-muted);}

  /* Вечірній підсумок */
  .evening-why{margin:6px 0 2px;padding-left:9px;border-left:2px solid var(--border);
    font-size:12.5px;color:var(--ink-soft);font-style:italic;line-height:1.45;}
  .evening-streak{font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .evening-card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:16px;}
  .evening-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .evening-title{font-family:'Inter',sans-serif;font-size:15px;font-weight:700;color:var(--ink);}
  .evening-later{border:none;background:none;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    color:var(--ink-muted);cursor:pointer;padding:4px 2px;}
  .evening-sub{font-size:12.5px;color:var(--ink-muted);line-height:1.45;margin-bottom:12px;}
  .evening-goal{padding:12px 0;border-top:1px solid var(--border);}
  .evening-goal:first-of-type{border-top:none;}
  .evening-goal-title{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.35;}
  .evening-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .evening-btn{border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);border-radius:999px;
    padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;}
  .evening-btn:active{transform:scale(.96);}
  .evening-btn.yes{background:var(--income-light);color:var(--income);border-color:transparent;}
  .evening-reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .evening-reason{border:1px solid var(--glass-btn-border);background:none;border-radius:999px;padding:6px 12px;
    font-family:'Inter',sans-serif;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .evening-reason:active{transform:scale(.96);}
  .evening-done{font-size:13px;color:var(--income);font-weight:600;}

  /* Щоденні дії з цілі — ті самі завдання, що й у розділі «Завдання»,
     просто показані звідси. Виконав таку дію — день у серії відмічається сам. */
  .actions-block{margin-bottom:20px;}
  /* Роздільник саме МІЖ рядками: :first-of-type тут не спрацював би —
     першим елементом того ж типу в блоці йде заголовок секції. */
  .action-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;}
  .action-row + .action-row{border-top:1px solid var(--border);}
  .action-check{flex-shrink:0;width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--glass-btn-border);
    background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;}
  .action-check svg{width:13px;height:13px;display:none;}
  .action-check.checked{background:var(--income);border-color:var(--income);}
  .action-check.checked svg{display:block;}
  .action-title{font-size:14.5px;color:var(--ink);line-height:1.4;}
  .action-row.done .action-title{color:var(--ink-muted);text-decoration:line-through;}
  .action-due{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .action-due.overdue{color:var(--expense);}
  .action-add-row{display:flex;gap:8px;margin-top:10px;}
  .action-add-row input{margin:0;flex:1;}
  .action-add-btn{flex-shrink:0;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .actions-empty{font-size:13px;color:var(--ink-muted);padding:6px 0;line-height:1.45;}

  .streak-row{display:flex;justify-content:center;margin-bottom:22px;}
  .streak-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);
    border-radius:999px;padding:11px 20px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .2s, transform .15s;}
  .streak-btn:active{transform:scale(.96);}
  .streak-btn.checked-today{background:var(--income-light);color:var(--income);border-color:transparent;}
  .streak-count{font-weight:800;font-variant-numeric:tabular-nums;}

  .journal-add-row{display:flex;gap:8px;margin-bottom:14px;}
  .journal-add-row textarea{margin:0;flex:1;min-height:40px;}
  .journal-add-btn{flex-shrink:0;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .journal-entry{padding:10px 0;border-top:1px solid var(--border);}
  .journal-entry:first-child{border-top:none;}
  .journal-entry-text{font-size:14px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .journal-entry-date{font-size:11px;color:var(--ink-muted);margin-top:4px;}

  .section-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin-bottom:10px;}

  .card-title{font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600;margin-bottom:4px;position:relative;}

  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-overlay.show{display:flex;}
  /* Системна смуга гортання з кнопками-стрілками випадає зі стилю шитів:
     власна — тонка й напівпрозора, як у чаті помічника. */
  .modal{scrollbar-width:thin;scrollbar-color:var(--card-border-hover) transparent;}
  .modal::-webkit-scrollbar{width:5px;}
  .modal::-webkit-scrollbar-track{background:transparent;}
  .modal::-webkit-scrollbar-thumb{background:var(--card-border-hover);border-radius:999px;}
  .modal{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;}
  .close-btn{background:none;border:none;cursor:pointer;color:var(--ink-muted);}
  label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .title-input{width:100%;font-family:'Inter',sans-serif;font-size:20px;font-weight:700;border:none;
    border-bottom:2px solid var(--border);padding:8px 0;margin-bottom:16px;outline:none;background:transparent;color:var(--ink);}
  .title-input:focus{border-color:var(--accent);}
  input[type=text], textarea{width:100%;font-family:'Inter',sans-serif;font-size:15.5px;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-top:6px;margin-bottom:16px;outline:none;color:var(--ink);background:var(--bg);}
  input[type=text]:focus, textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .form-error{color:var(--expense);font-size:13px;margin-bottom:8px;}
  .submit-btn{width:100%;margin-top:4px;padding:13px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;
    font-size:15px;font-weight:600;font-family:'Inter',sans-serif;background:var(--accent);}
  .submit-btn:disabled{opacity:.55;cursor:default;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions .submit-btn{margin-top:0;flex:1;}
  .btn-delete{border:none;background:var(--expense);color:#fff;font-weight:500;border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;}

  .milestone-editor-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .milestone-editor-row input{margin:0;flex:1;}
  .milestone-remove-btn{flex-shrink:0;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .milestone-remove-btn:hover{border-color:var(--expense);color:var(--expense);}
  .target-row{display:flex;gap:8px;}
  .target-row input{margin:0;}
  .target-row input[type=number]{flex:2;min-width:0;}
  .target-row input[type=text]{flex:1;min-width:0;}
  .field-hint{font-size:12px;color:var(--ink-muted);margin:6px 0 14px;line-height:1.4;}
  /* Смужка числового прогресу на екрані цілі: та сама мова, що й у міні-смужці
     на картці, але більша й з підписом. */
  .value-progress{margin:4px 0 14px;}
  .value-progress-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .value-progress-now{font-family:'Inter',sans-serif;font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;}
  .value-progress-pct{font-size:14px;font-weight:700;color:var(--accent);}
  .value-progress-bar{height:10px;border-radius:99px;background:var(--control-bg);overflow:hidden;}
  .value-progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease;}
  .value-add-row{display:flex;gap:8px;margin-top:10px;}
  .value-add-row input{flex:1;min-width:0;margin:0;}
  .value-add-btn{flex-shrink:0;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:0 16px;}
  .value-add-btn:disabled{opacity:.5;cursor:default;}
  .add-milestone-btn{width:100%;border:1px dashed var(--border);background:transparent;color:var(--accent);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;padding:10px 0;border-radius:8px;cursor:pointer;margin-bottom:16px;}
  .add-milestone-btn:hover{border-color:var(--accent);}
  /* Кнопка розбиття стоїть ПІД «додати віху», а не замість неї: писати
     самому лишається основним способом, підказка — допоміжним. */
  .breakdown-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;padding:10px 0;border-radius:8px;cursor:pointer;
    margin-top:-8px;margin-bottom:10px;}
  .breakdown-btn:disabled{opacity:.55;cursor:default;}
  .breakdown-btn svg{opacity:.7;}
  .breakdown-note{font-size:12.5px;color:var(--ink-muted);line-height:1.45;margin-bottom:14px;}
  .breakdown-note:empty{display:none;}

  /* ---- Кастомний datepicker (той самий компонент, що й у tasks/) ---- */
  .dp-field{position:relative;margin-top:6px;margin-bottom:16px;}
  input[data-dp-native]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .dp-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-family:'Inter',sans-serif;font-size:15.5px;text-align:left;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink);
    cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .dp-trigger:hover, .dp-trigger:focus-visible{border-color:var(--accent);}
  .dp-field.open .dp-trigger{border-color:var(--accent);}
  .dp-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dp-trigger-text.dp-placeholder{color:var(--ink-muted);}
  .dp-trigger-icon{flex-shrink:0;color:var(--ink-muted);display:flex;}
  .dp-panel{position:fixed;z-index:55;width:280px;max-width:calc(100vw - 32px);
    background:var(--surface);backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    border:1px solid var(--border);border-radius:18px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.18);
    padding:14px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .14s ease,transform .14s ease;}
  .dp-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-head-label{font-size:14px;font-weight:600;color:var(--ink);text-transform:capitalize;}
  .dp-nav{display:flex;gap:4px;}
  .dp-nav-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dp-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .dp-weekday{font-size:11px;font-weight:600;color:var(--ink-muted);text-align:center;padding:4px 0;text-transform:uppercase;}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);background:transparent;border:none;border-radius:50%;
    cursor:pointer;}
  .dp-day:hover:not(:disabled):not(.dp-day-selected){background:var(--accent-light);}
  .dp-day.dp-day-muted{color:var(--ink-muted);opacity:.45;}
  .dp-day.dp-day-today:not(.dp-day-selected)::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .dp-day.dp-day-selected{background:var(--accent);color:#fff;font-weight:600;}
  .dp-day:disabled{opacity:.28;cursor:default;}
  .dp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .dp-today-btn, .dp-clear-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;}
  .dp-clear-btn{color:var(--ink-muted);}
  .dp-today-btn:hover, .dp-clear-btn:hover{text-decoration:underline;}

  .confirm-modal{position:fixed;inset:0;background:rgba(34,38,43,.32);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .confirm-modal.show{display:flex;}
  .confirm-box{background:var(--surface);border-radius:22px;padding:22px;max-width:340px;width:100%;}
  .confirm-title{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;margin-bottom:6px;}
  .confirm-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;}
  .btn-cancel{border:1px solid var(--border);background:transparent;color:var(--ink-soft);}

  svg.icon{display:inline-block;vertical-align:middle;}

  @media (min-width:880px){
    body{padding-bottom:32px;}
    .wrap{max-width:none;margin:0;padding:0 40px;}
    .app-topbar{padding:28px 0 0;}
    .content{max-width:640px;margin:0 auto;padding:20px 4px 40px;}
    #goalDetailScreen{max-width:640px;margin:0 auto;padding:20px 4px 40px;}
    .bottom-nav{left:auto;right:32px;bottom:32px;margin:0;width:350px;}
    .bn-fab{--fab-right:32px;--fab-bottom:104px;}
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px;max-height:88vh;}
  }
</style>
</head>
<body>

<div class="background"></div>

<div id="authLoading" aria-hidden="true"><div class="spinner"></div></div>

<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B7A9D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
    </div>
    <div class="auth-title" id="authTitle">Вхід</div>
    <div class="auth-sub" id="authSub">Увійди, щоб дані синхронізувались між твоїми пристроями.</div>
    <form id="authForm" autocomplete="on">
      <label class="field-label" id="authEmailLabel">Email</label>
      <input type="email" id="authEmail" name="email" autocomplete="username">
      <label class="field-label" id="authPasswordLabel">Пароль</label>
      <input type="password" id="authPassword" name="password" autocomplete="current-password">
      <div class="auth-hint" id="authPasswordHint" style="display:none;font-size:12px;color:var(--ink-muted);margin:4px 0 12px;">Мінімум 6 символів</div>
      <div class="auth-options-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked>
          <span id="rememberMeLabel">Запам'ятати мене</span>
        </label>
        <a id="forgotPasswordLink">Забув(ла) пароль?</a>
      </div>
      <div class="auth-error" id="authError" role="alert" aria-live="assertive"></div>
      <div class="auth-info" id="authInfo"></div>
      <button class="auth-submit" id="authSubmit" type="submit">Увійти</button>
    </form>
    <div class="auth-switch" id="authSwitch">Ще немає акаунта? <a id="authToggle">Зареєструватися</a></div>
    <div class="lang-row" id="authLangRow"></div>
  </div>
</div>

<div id="appScreen">
<div class="wrap" id="wrap">
  <div class="app-topbar">
    <a href="../index.html" class="app-topbar-brand" id="topbarHomeLink" aria-label="На головну">Life</a>
    <div class="topbar-actions">
      <button class="ai-topbar-btn" id="aiChatBtn" aria-label="AI-помічник">AI</button>
    </div>
  </div>

  <div id="dashboardScreen">
  <div class="content">
    <div class="badges-row" id="badgesRow"></div>
    <div id="reviewBanner"></div>
    <div id="eveningCard"></div>
    <div class="status-filter-row" id="statusFilterRow"></div>
    <div id="retroBlock"></div>
    <div id="goalsList"></div>
  </div>
  </div>


  

<button type="button" class="bn-fab" id="openNewGoalBtn" aria-label="Нова ціль">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

<!-- Дві вкладки — два горизонти планування. Вкладки «Головна» тут більше
     немає: на хаб веде напис Life у шапці, той самий, що й у решті модулів,
     тож виходу це не забирає, а місце в меню звільняє під те, заради чого
     в розділ і заходять. -->
<nav class="bottom-nav" id="bottomNav">
    <div class="bn-side">
      <button type="button" class="bn-item active" id="bnMonth" data-horizon="month">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        <span id="bnMonthLabel">Місяць</span>
      </button>
    </div>
    <div class="bn-side">
      <button type="button" class="bn-item" id="bnYear" data-horizon="year">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3.2a15 15 0 0 1 0 17.6M12 3.2a15 15 0 0 0 0 17.6"/></svg>
        <span id="bnYearLabel">Рік</span>
      </button>
    </div>
  </nav>

  <!-- Огляд тижня. Окремий екран, а не ще один блок на дашборді: рішення тут
       свідомі, і їх не приймають між ділом, гортаючи список. -->
  <div id="reviewScreen">
    <div class="detail-header">
      <button type="button" id="reviewBackBtn" class="cal-nav-btn" aria-label="Назад">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="detail-title" id="reviewTitleLabel">Огляд тижня</div>
      <span style="width:34px;"></span>
    </div>
    <div class="review-sub" id="reviewSubLabel"></div>
    <div id="reviewList"></div>
  </div>

  <div id="goalDetailScreen">
    <div class="detail-header">
      <button type="button" id="detailBackBtn" class="cal-nav-btn" aria-label="Назад">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="detail-title" id="detailTitleLabel"></div>
      <button type="button" id="detailEditBtn" class="cal-nav-btn" aria-label="Редагувати">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <div class="detail-badges-row" id="detailBadgesRow"></div>
    <div id="detailWhyBlock"></div>
    <div id="detailProgressBlock"></div>
    <div id="detailLapseBlock"></div>
    <div id="detailPlanBlock"></div>
    <div id="detailPaceBlock"></div>
    <div id="detailMeasureBlock"></div>
    <div id="detailDriftRow"></div>
    <div id="detailChartBlock"></div>
    <div id="detailJourneyBlock"></div>
    <div id="detailActionsBlock"></div>
    <div id="detailRescueBlock"></div>
    <div class="streak-row" id="detailStreakRow"></div>
    <div id="detailParentBlock"></div>
    <div id="detailChildrenBlock"></div>
    <div id="detailBlockersBlock"></div>
    <div id="detailPauseRow"></div>
    <div class="section-label" id="journalSectionLabel">Щоденник</div>
    <div class="journal-add-row">
      <textarea id="journalInput" maxlength="2000"></textarea>
      <button type="button" class="journal-add-btn" id="journalAddBtn">+</button>
    </div>
    <div id="journalList"></div>
  </div>
</div>
</div>

<!-- ---- Форма цілі (створення / редагування) ---- -->
<div class="modal-overlay" id="goalFormOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="goalModalTitle">Нова ціль</div>
      <button class="close-btn" id="closeGoalForm" aria-label="Закрити"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <form id="goalForm">
      <input type="text" id="goalTitleInput" class="title-input" placeholder="Назва цілі" maxlength="200">

      <!-- Горизонт стоїть першим після назви: він вирішує, на якій вкладці
           ціль опиниться, і питати про це в кінці форми було б пізно. -->
      <label class="field-label" id="horizonLabel">Горизонт</label>
      <div class="choice-row" id="horizonPicker"></div>
      <div class="field-hint" id="horizonHint"></div>

      <!-- Якій річній цілі служить ця місячна. Показується лише на місячній:
           рік — це напрямок, і підпорядковувати його комусь ні до чого. -->
      <div id="parentBlock" style="display:none;">
        <label class="field-label" id="parentLabel">Служить річній цілі</label>
        <div class="choice-row" id="parentPicker"></div>
        <div class="field-hint" id="parentHint"></div>
      </div>

      <label class="field-label" id="categoryLabel">Категорія</label>
      <div class="category-picker" id="categoryPicker"></div>

      <label class="field-label" id="whyLabel">Навіщо тобі це?</label>
      <textarea id="goalWhyInput" maxlength="1000"></textarea>

      <label class="field-label" id="planLabel">Коли саме ти це робиш?</label>
      <div class="plan-fields">
        <input type="text" id="goalPlanCue" maxlength="120">
        <input type="text" id="goalPlanAction" maxlength="120">
      </div>
      <div class="field-hint" id="planHint"></div>

      <label class="field-label" id="targetDateLabel">Дедлайн (необовʼязково)</label>
      <input type="date" id="goalTargetDate" data-dp-native data-dp-clearable>

      <label class="field-label" id="targetValueLabel">Числова мета (необовʼязково)</label>
      <div class="target-row">
        <input type="number" id="goalTargetValue" inputmode="decimal" step="any" min="0" placeholder="10">
        <input type="text" id="goalUnitInput" maxlength="20" placeholder="км">
      </div>
      <div class="field-hint" id="targetValueHint">Якщо задати — прогрес рахується числом, а не віхами.</div>

      <!-- Звʼязок зі скарбничкою бюджету. Показується лише тоді, коли задана
           числова мета: без неї підтягувати нема куди. -->
      <div id="savingsLinkBlock" style="display:none;">
        <label class="field-label" id="savingsLinkLabel">Брати число зі скарбнички</label>
        <div class="choice-row" id="savingsLinkPicker"></div>
        <div class="field-hint" id="savingsLinkHint"></div>
      </div>

      <label class="field-label" id="milestonesLabel">Віхи</label>
      <div id="milestonesEditor"></div>
      <button type="button" class="add-milestone-btn" id="addMilestoneBtn">+ Додати віху</button>
      <button type="button" class="breakdown-btn" id="breakdownBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" d="M12.6 4.0C15.52 9.68 15.52 9.68 21.2 12.6C15.52 15.52 15.52 15.52 12.6 21.2C9.68 15.52 9.68 15.52 4.0 12.6C9.68 9.68 9.68 9.68 12.6 4.0ZM5.4 2.40C6.49 4.51 6.49 4.51 8.60 5.6C6.49 6.69 6.49 6.69 5.4 8.8C4.31 6.69 4.31 6.69 2.2 5.6C4.31 4.51 4.31 4.51 5.4 2.40Z"/></svg>
        <span id="breakdownBtnLabel">Запропонувати віхи</span>
      </button>
      <div class="breakdown-note" id="breakdownNote"></div>

      <div class="form-error" id="goalFormError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="deleteGoalBtn" style="display:none;">Видалити</button>
        <button class="submit-btn" id="goalSubmitBtn" type="submit">Зберегти</button>
      </div>
    </form>
  </div>
</div>

<!-- ---- Підтвердження видалення ---- -->
<div class="confirm-modal" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Видалити ціль?</div>
    <div class="confirm-sub" id="confirmSub">Цю дію не можна скасувати.</div>
    <div class="confirm-actions">
      <button class="btn-cancel" id="confirmCancel">Скасувати</button>
      <button class="btn-delete" id="confirmDelete">Видалити</button>
    </div>
  </div>
</div>

<script src="streak.js"></script>
<script src="review.js"></script>
<script src="app.js"></script>
<script src="../ai-chat.js"></script>

</body>

<!DOCTYPE html>
<html lang="uk" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEF3">
<meta name="description" content="Life — особистий простір: бюджет, цілі, щоденні завдання, тренування.">
<!--
  CSP: дозволяємо лише Firebase Auth/App Check + свої файли. Firestore тут
  теж потрібен (для синхронізації вибору теми між головною та /budget/).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com;
  frame-src https://www.google.com/recaptcha/ https://me-and-only-me-7f531.firebaseapp.com;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="budget/icon-192.png">
<link rel="icon" href="budget/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<style>
  :root{
    --bg:#F4F6FB;
    --bg-radial: radial-gradient(circle at 50% 0%, #ffffff 0%, #f8f9fb 40%, #eef1f5 100%);
    --surface:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.46));
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:rgba(255,255,255,.85);
    --card-border-hover: rgba(255,255,255,1);
    --card-hover-shadow: 0 25px 70px rgba(40,50,70,.12), 0 0 50px rgba(170,190,255,.18);
    --card-shine: rgba(255,255,255,.35);
    --glass-btn-bg: rgba(255,255,255,.55); --glass-btn-bg-hover: rgba(255,255,255,.85); --glass-btn-border: rgba(255,255,255,.9);
    --glass-blur:25px; --glass-shadow:0 15px 50px rgba(40,50,70,.08), inset 0 1px 1px rgba(255,255,255,.9);
    --accent:#4A6FA5; --expense:#C9683F; --income:#4F9C74;
    --top-glow-opacity: 1; --beam-opacity: 0;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#050506;
    --bg-radial: radial-gradient(circle at 50% 0%, #1a1b1f 0%, #0c0d0f 42%, #050506 100%);
    --surface:linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
    --ink:#ffffff; --ink-soft:#a9acb4; --ink-muted:#75787f;
    --border:rgba(255,255,255,.12);
    --card-border-hover: rgba(255,255,255,.22);
    --card-hover-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 60px rgba(160,170,255,.10);
    --card-shine: rgba(255,255,255,.08);
    --glass-btn-bg: rgba(255,255,255,.065); --glass-btn-bg-hover: rgba(255,255,255,.12); --glass-btn-border: rgba(255,255,255,.16);
    --glass-blur:25px; --glass-shadow:0 20px 60px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.08);
    --accent:#8FA6E0; --expense:#E39A76; --income:#7FCB9E;
    --top-glow-opacity: .1; --beam-opacity: 1;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);overscroll-behavior-y:none;scrollbar-gutter:stable;overflow-y:scroll;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; background:var(--bg);
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    transition:background-color .2s ease, color .2s ease;
  }
  .background{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background: var(--bg-radial); transition: background .2s ease;
  }
  .bg-top-glow{position:absolute; left:50%; top:-420px; width:1300px; height:780px; transform:translateX(-50%);
    border-radius:50%; background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 32%, rgba(255,255,255,0) 66%);
    filter:blur(30px); opacity:var(--top-glow-opacity); transition:opacity .2s ease;}
  .bg-top-ring{position:absolute; left:50%; top:-1180px; width:1500px; height:1500px; transform:translateX(-50%);
    border-radius:50%;
    background:conic-gradient(from 205deg at 50% 50%, transparent 0deg, rgba(255,255,255,.85) 22deg, rgba(255,255,255,0) 62deg, transparent 360deg);
    filter:blur(4px); opacity:var(--top-glow-opacity); transition:opacity .2s ease;}
  .bg-beam-tl{position:absolute; top:-90px; left:-240px; width:720px; height:130px; transform:rotate(35deg); border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent); filter:blur(42px);
    opacity:var(--beam-opacity); transition:opacity .2s ease;}
  .bg-beam-br{position:absolute; bottom:-140px; right:-220px; width:760px; height:140px; transform:rotate(35deg); border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,210,225,.20), transparent); filter:blur(46px);
    opacity:var(--beam-opacity); transition:opacity .2s ease;}

  .wrap{max-width:480px;margin:0 auto;padding:20px 20px 48px;}

  /* ---- Верхня панель: гамбургер-меню зліва (тема / мова / вихід) ---- */
  .home-topbar{display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px;}
  .menu-btn{background:none;border:none;cursor:pointer;color:var(--ink);padding:13px;display:flex;border-radius:10px;transition:background .2s, transform .15s;touch-action:manipulation;}
  .menu-btn:hover{background:var(--glass-btn-bg-hover);}
  .menu-btn:active{transform:scale(.92);}
  .menu-btn-lines{width:20px;height:16px;position:relative;display:inline-block;flex-shrink:0;}
  .menu-btn-lines span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;
    transition:top .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1), opacity .2s ease;}
  .menu-btn-lines span:nth-child(1){top:0;}
  .menu-btn-lines span:nth-child(2){top:7px;}
  .menu-btn-lines span:nth-child(3){top:14px;}
  .menu-btn.open .menu-btn-lines span:nth-child(1){top:7px; transform:rotate(45deg);}
  .menu-btn.open .menu-btn-lines span:nth-child(2){opacity:0; transform:scaleX(0);}
  .menu-btn.open .menu-btn-lines span:nth-child(3){top:7px; transform:rotate(-45deg);}
  .app-menu-overlay{position:fixed;inset:0;z-index:55;display:none;}
  .app-menu-overlay.show{display:block;}
  .app-menu{position:absolute;top:calc(62px + env(safe-area-inset-top));left:13px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;box-shadow:var(--glass-shadow);
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    padding:14px;min-width:220px;max-width:min(280px, calc(100vw - 32px));}
  .app-menu-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 6px;padding:0 2px;}
  .app-menu-divider{height:1px;background:var(--border);margin:12px 0;}
  .theme-picker, .lang-picker{display:flex;flex-wrap:wrap;gap:4px;}
  .theme-choice, .lang-choice{
    border:none;background:var(--glass-btn-bg);color:var(--ink-muted);font-family:'Inter',sans-serif;
    font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
    transition:background .25s, color .25s, transform .15s;
  }
  .theme-choice:active, .lang-choice:active{transform:scale(.92);}
  .theme-choice.selected, .lang-choice.selected{background:var(--accent);color:#fff;}
  .app-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;
    background:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13.5px;
    color:var(--ink-soft);text-align:left;margin-top:2px;transition:background .2s, transform .15s;}
  .app-menu-item:hover{background:var(--glass-btn-bg-hover);}
  .app-menu-item:active{transform:scale(.97);}
  .app-menu-item svg{stroke:currentColor;flex-shrink:0;}

  /* ---- Desktop layout — та сама структура, що й у budget/: .wrap на всю
     ширину (кнопка меню біля справжнього краю), а вміст центрується на 960px ---- */
  @media (min-width:880px){
    .wrap{max-width:none;margin:0;padding:0 40px 48px;}
    .home-topbar{padding-top:28px;}
    .app-menu{top:74px;left:33px;}
    .hero, .sections{max-width:720px;margin-left:auto;margin-right:auto;}
  }

  .hero{text-align:center;padding:40px 0 48px;}
  .hero h1{font-size:clamp(52px,10vw,80px);font-weight:900;letter-spacing:-0.04em;margin:0;line-height:0.9;}

  .sections{display:flex;flex-direction:column;gap:16px;}

  .module-card{
    position:relative; overflow:hidden;
    background:var(--surface); border:1px solid var(--border); border-radius:26px;
    padding:24px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px;
    text-decoration:none; color:inherit;
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    box-shadow: var(--glass-shadow);
    transition: transform .35s, border-color .35s, box-shadow .35s;
  }
  .module-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(120deg, transparent 25%, var(--card-shine) 50%, transparent 75%);
    transform:translateX(-120%); transition:transform .8s ease;
  }
  a.module-card:hover::after{transform:translateX(120%);}
  .module-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  a.module-card:hover{transform:translateY(-6px); border-color:var(--card-border-hover); box-shadow: var(--card-hover-shadow), var(--glass-shadow);}
  a.module-card:active{transform:translateY(-2px) scale(.99);}

  /* Назва + пояснювальний підпис: коротка назва читається з першого погляду,
     підпис знімає питання «чим цей модуль відрізняється від сусіднього». */
  .module-text{min-width:0;}
  .module-title{font-size:21px;font-weight:700;letter-spacing:-0.01em;margin:0;}
  /* Один рядок: підпис не має розсувати картку — інакше на вузькому екрані
     картки стають різної висоти. Якщо не влазить — обрізаємо трикрапкою. */
  .module-sub{font-size:12.5px;line-height:1.3;color:var(--ink-muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .open-btn{
    flex-shrink:0; display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink);
    background:var(--glass-btn-bg);border:1px solid var(--glass-btn-border);padding:10px 18px;border-radius:999px;
    transition:background .3s, transform .3s;
  }
  a.module-card:hover .open-btn{background:var(--glass-btn-bg-hover); transform:translateX(2px);}
  .open-btn svg{width:14px;height:14px;stroke:currentColor;}
  /* Дуже вузькі екрани (320px): слово «Відкрити» з'їдає стільки місця, що
     підпис лишається обрізаним. Лишаємо саму стрілку — вона зрозуміла і без слова. */
  @media (max-width:359px){
    .module-card{padding:20px 18px;gap:12px;}
    .open-btn{padding:10px 12px;}
    .open-btn > span{display:none;}
  }

  /* ---- Екран входу ---- */
  #authScreen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    box-shadow: var(--glass-shadow);}
  .auth-logo{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
  .auth-title{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-hint{font-size:12px;color:var(--ink-muted);margin:4px 0 12px;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;transition:transform .15s, opacity .2s;}
  .auth-submit:active:not(:disabled){transform:scale(.97);}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}

  @media (prefers-reduced-motion: reduce){
    a.module-card, .open-btn, .icon-btn, .theme-choice{transition:none;}
    .spinner{animation:none;opacity:.55;}
  }
</style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-top-glow"></div>
    <div class="bg-top-ring"></div>
    <div class="bg-beam-tl"></div>
    <div class="bg-beam-br"></div>
  </div>

  <!-- ---- Нейтральний екран, поки Firebase перевіряє збережену сесію ---- -->
  <div id="authLoading" aria-hidden="true"><div class="spinner"></div></div>

  <!-- ---- Екран входу ---- -->
  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-logo">Life</div>
      <div class="auth-title" id="authTitle">Вхід</div>
      <div class="auth-sub" id="authSub">Увійди, щоб потрапити у свій особистий простір.</div>
      <form id="authForm" autocomplete="on">
        <label class="field-label" id="authEmailLabel" for="authEmail">Email</label>
        <input type="email" id="authEmail" name="email" autocomplete="username">
        <label class="field-label" id="authPasswordLabel" for="authPassword">Пароль</label>
        <input type="password" id="authPassword" name="password" autocomplete="current-password">
        <div class="auth-hint" id="authPasswordHint" style="display:none;">Мінімум 6 символів</div>
        <div class="auth-options-row">
          <label class="remember-me"><input type="checkbox" id="rememberMe" checked><span id="rememberMeLabel">Запам'ятати мене</span></label>
          <a id="forgotPasswordLink">Забув(ла) пароль?</a>
        </div>
        <div class="auth-error" id="authError" role="alert" aria-live="assertive"></div>
        <div class="auth-info" id="authInfo"></div>
        <button class="auth-submit" id="authSubmit" type="submit">Увійти</button>
      </form>
      <div class="auth-switch" id="authSwitch">Ще немає акаунта? <a id="authToggle">Зареєструватися</a></div>
    </div>
  </div>

  <!-- ---- Головна (після входу) ---- -->
  <div id="homeScreen" style="display:none;">
    <div class="wrap">
      <div class="home-topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Меню">
          <span class="menu-btn-lines" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>

      <div class="app-menu-overlay" id="appMenuOverlay">
        <div class="app-menu" id="appMenu">
          <div class="app-menu-label" id="themeMenuLabel">Тема</div>
          <div class="theme-picker" id="themePicker"></div>

          <div class="app-menu-divider"></div>

          <div class="app-menu-label" id="langMenuLabel">Мова</div>
          <div class="lang-picker" id="langPicker"></div>

          <div class="app-menu-divider"></div>

          <button class="app-menu-item" id="logoutBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span id="logoutLabel">Вийти</span>
          </button>
        </div>
      </div>

      <header class="hero">
        <h1>Life</h1>
      </header>

      <main class="sections">
        <a class="module-card" href="budget/index.html">
          <div class="module-text">
            <h2 class="module-title" id="budgetTitle">Бюджет</h2>
            <div class="module-sub" id="budgetSub">витрати й доходи</div>
          </div>
          <span class="open-btn"><span id="openBtnLabel">Відкрити</span> <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </a>

        <a class="module-card" href="goals/index.html" id="goalsCard">
          <div class="module-text">
            <h2 class="module-title" id="goalsTitle">Цілі</h2>
            <div class="module-sub" id="goalsSub">довгострокові</div>
          </div>
          <span class="open-btn"><span id="goalsOpenBtnLabel">Відкрити</span> <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </a>

        <a class="module-card" href="tasks/index.html" id="tasksCard">
          <div class="module-text">
            <h2 class="module-title" id="tasksTitle">Завдання</h2>
            <div class="module-sub" id="tasksSub">на кожен день</div>
          </div>
          <span class="open-btn"><span id="tasksOpenBtnLabel">Відкрити</span> <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </a>

        <a class="module-card" href="workout/index.html" id="workoutCard">
          <div class="module-text">
            <h2 class="module-title" id="workoutTitle">Тренування</h2>
            <div class="module-sub" id="workoutSub">сесії й рекорди</div>
          </div>
          <span class="open-btn"><span id="workoutOpenBtnLabel">Відкрити</span> <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </a>
      </main>
    </div>
  </div>

  <script src="budget/firebase-config.js"></script>
  <script src="home.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Ті самі три теги, що й у кожному модулі. Без них головна поводилась
     на iPhone інакше за решту сторінок, хоч і живе в тому ж застосунку. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="description" content="Life — особистий простір: бюджет, цілі, щоденні завдання, тренування.">
<!--
  CSP: дозволяємо лише Firebase Auth/App Check + свої файли. Firestore тут
  теж потрібен (для синхронізації вибору теми між головною та /budget/).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdnjs.cloudflare.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://us-central1-me-and-only-me-7f531.cloudfunctions.net;
  frame-src https://www.google.com/recaptcha/ https://me-and-only-me-7f531.firebaseapp.com;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="budget/icon-192.png">
<link rel="icon" href="budget/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<style>
  :root{
    --bg:#F4F6FB;
    --bg-radial: radial-gradient(circle at 50% 0%, #ffffff 0%, #f8f9fb 40%, #eef1f5 100%);
    /* Колір смуги над сторінкою — області статус-бару в standalone на iOS.
       Шар із градієнтом (.background) туди НЕ дістає: у встановленому
       застосунку він розтягується на viewport, а смуга статус-бару лежить
       поза ним. Малює її тло html, тож воно й мусить дорівнювати ПОЧАТКУ
       --bg-radial над ним — інакше вгорі видно шов. Знизу градієнт дістає,
       тому там нічого міняти не треба. */
    --status-bar: #ffffff;
    --surface:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.46));
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:rgba(255,255,255,.85);
    --card-border-hover: rgba(255,255,255,1);
    --card-hover-shadow: 0 25px 70px rgba(40,50,70,.12), 0 0 50px rgba(170,190,255,.18);
    --card-shine: rgba(255,255,255,.35);
    --ring-track: rgba(38,38,43,.10);
    --glass-btn-bg: rgba(255,255,255,.55); --glass-btn-bg-hover: rgba(255,255,255,.85); --glass-btn-border: rgba(255,255,255,.9);
    --glass-blur:25px; --glass-shadow:0 15px 50px rgba(40,50,70,.08), inset 0 1px 1px rgba(255,255,255,.9);
    --accent:#4A6FA5; --expense:#C9683F; --income:#4F9C74;
    --top-glow-opacity: 1; --beam-opacity: 0;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#050506;
    --bg-radial: radial-gradient(circle at 50% 0%, #1a1b1f 0%, #0c0d0f 42%, #050506 100%);
    --status-bar: #1a1b1f;
    --surface:linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
    --ink:#ffffff; --ink-soft:#a9acb4; --ink-muted:#75787f;
    --border:rgba(255,255,255,.12);
    --card-border-hover: rgba(255,255,255,.22);
    --card-hover-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 60px rgba(160,170,255,.10);
    --card-shine: rgba(255,255,255,.08);
    --ring-track: rgba(255,255,255,.13);
    --glass-btn-bg: rgba(255,255,255,.065); --glass-btn-bg-hover: rgba(255,255,255,.12); --glass-btn-border: rgba(255,255,255,.16);
    --glass-blur:25px; --glass-shadow:0 20px 60px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.08);
    --accent:#8FA6E0; --expense:#E39A76; --income:#7FCB9E;
    --top-glow-opacity: .1; --beam-opacity: 1;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  /* scrollbar-gutter лишається — він тримає ширину сторінки незмінною на
     комп'ютері. А от overflow-y:scroll малював смугу навіть тоді, коли
     гортати нічого. */
  /* Колір тла живе ТІЛЬКИ тут: html малює полотно сторінки (і те, що видно
     під час overscroll). У body його бути не повинно — див. нижче. */
  html{background:var(--status-bar);overscroll-behavior-y:none;scrollbar-gutter:stable;
    transition:background-color .2s ease;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; min-height:100svh;
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    transition:color .2s ease;
  }
  /* Шар зі світлом. Він лежить під вмістом (z-index:-1), і саме тому в body
     НЕ МОЖЕ бути власного тла: body — звичайний потоковий нащадок html, а
     потокові нащадки малюються ПІСЛЯ відʼємних z-index. Тобто непрозоре тло
     body зафарбовувало це світло повністю, і воно не було видно ніколи —
     крім одного випадку: коли відкривалось меню. У .app-menu є
     backdrop-filter, а він змушує браузер зібрати композицію заново, і шар
     на мить проступав. Звідси й враження, що світло «вмикає» бургер. */
  .background{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background: var(--bg-radial); transition: background .2s ease;
  }
  .bg-top-glow{position:absolute; left:50%; top:-420px; width:1300px; height:780px; transform:translateX(-50%);
    border-radius:50%; background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 32%, rgba(255,255,255,0) 66%);
    filter:blur(30px); opacity:var(--top-glow-opacity); transition:opacity .2s ease;}
  .bg-top-ring{position:absolute; left:50%; top:-1180px; width:1500px; height:1500px; transform:translateX(-50%);
    border-radius:50%;
    background:conic-gradient(from 205deg at 50% 50%, transparent 0deg, rgba(255,255,255,.85) 22deg, rgba(255,255,255,0) 62deg, transparent 360deg);
    filter:blur(4px); opacity:var(--top-glow-opacity); transition:opacity .2s ease;}
  .bg-beam-tl{position:absolute; top:-90px; left:-240px; width:720px; height:130px; transform:rotate(35deg); border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent); filter:blur(42px);
    opacity:var(--beam-opacity); transition:opacity .2s ease;}
  .bg-beam-br{position:absolute; bottom:-140px; right:-220px; width:760px; height:140px; transform:rotate(35deg); border-radius:999px;
    background:linear-gradient(90deg, transparent, rgba(255,210,225,.20), transparent); filter:blur(46px);
    opacity:var(--beam-opacity); transition:opacity .2s ease;}

  .wrap{max-width:480px;margin:0 auto;padding:20px 20px 48px;}

  /* ---- Верхня панель: гамбургер-меню зліва (тема / мова / вихід) ---- */
  .home-topbar{display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px;}
  .home-brand{font-size:23px;font-weight:800;letter-spacing:-0.03em;color:var(--ink);padding-left:4px;}
  .topbar-spacer{flex-grow:1;}
  .menu-btn{background:none;border:none;cursor:pointer;color:var(--ink);padding:13px;display:flex;border-radius:10px;transition:background .2s, transform .15s;touch-action:manipulation;}
  .menu-btn:hover{background:var(--glass-btn-bg-hover);}
  .menu-btn:active{transform:scale(.92);}
  .menu-btn-lines{width:20px;height:16px;position:relative;display:inline-block;flex-shrink:0;}
  .menu-btn-lines span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;
    transition:top .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1), opacity .2s ease;}
  .menu-btn-lines span:nth-child(1){top:0;}
  .menu-btn-lines span:nth-child(2){top:7px;}
  .menu-btn-lines span:nth-child(3){top:14px;}
  .menu-btn.open .menu-btn-lines span:nth-child(1){top:7px; transform:rotate(45deg);}
  .menu-btn.open .menu-btn-lines span:nth-child(2){opacity:0; transform:scaleX(0);}
  .menu-btn.open .menu-btn-lines span:nth-child(3){top:7px; transform:rotate(-45deg);}
  .app-menu-overlay{position:fixed;inset:0;z-index:55;display:none;}
  .app-menu-overlay.show{display:block;}
  .app-menu{position:absolute;top:calc(62px + env(safe-area-inset-top));left:13px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;box-shadow:var(--glass-shadow);
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    padding:14px;min-width:220px;max-width:min(280px, calc(100vw - 32px));}
  .app-menu-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 6px;padding:0 2px;}
  .app-menu-divider{height:1px;background:var(--border);margin:12px 0;}
  .theme-picker, .lang-picker{display:flex;flex-wrap:wrap;gap:4px;}
  .theme-choice, .lang-choice{
    border:none;background:var(--glass-btn-bg);color:var(--ink-muted);font-family:'Inter',sans-serif;
    font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
    transition:background .25s, color .25s, transform .15s;
  }
  .theme-choice:active, .lang-choice:active{transform:scale(.92);}
  .theme-choice.selected, .lang-choice.selected{background:var(--accent);color:#fff;}
  .app-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;
    background:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13.5px;
    color:var(--ink-soft);text-align:left;margin-top:2px;transition:background .2s, transform .15s;}
  .app-menu-item:hover{background:var(--glass-btn-bg-hover);}
  .app-menu-item:active{transform:scale(.97);}
  .app-menu-item svg{stroke:currentColor;flex-shrink:0;}

  /* ---- Діалог експорту ---- */
  .export-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
    background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .export-overlay.show{display:flex;}
  /* Системна смуга гортання з кнопками-стрілками випадає зі стилю шитів:
     власна — тонка й напівпрозора, як у чаті помічника. */
  .export-sheet{scrollbar-width:thin;scrollbar-color:var(--card-border-hover) transparent;}
  .export-sheet::-webkit-scrollbar{width:5px;}
  .export-sheet::-webkit-scrollbar-track{background:transparent;}
  .export-sheet::-webkit-scrollbar-thumb{background:var(--card-border-hover);border-radius:999px;}
  .export-sheet{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:480px;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    backdrop-filter:blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(150%);
    box-shadow:var(--glass-shadow);}
  .export-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .export-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
  .export-close{background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;display:flex;}
  .export-group-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-muted);margin:14px 0 8px;}
  .export-group-label:first-of-type{margin-top:0;}
  .export-options{display:flex;flex-wrap:wrap;gap:6px;}
  /* Розділи й формати — однакові плашки: різниця лише в тому, що розділів
     можна обрати кілька, а формат один. Показувати це двома різними
     віджетами (галочки й радіо) означало б ускладнити на рівному місці. */
  .export-chip{border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;
    cursor:pointer;transition:background .2s, color .2s, transform .15s;}
  .export-chip:active{transform:scale(.95);}
  .export-chip.selected{background:var(--accent);color:#fff;border-color:transparent;}
  .export-hint{font-size:12px;color:var(--ink-muted);line-height:1.45;margin-top:8px;}
  .export-save-btn{width:100%;margin-top:18px;border:none;border-radius:12px;padding:13px 0;
    background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
  .export-save-btn:disabled{opacity:.55;cursor:default;}
  .export-save-btn:active:not(:disabled){transform:scale(.98);}
  .export-error{font-size:13px;color:var(--expense);margin-top:10px;min-height:16px;line-height:1.4;}

  /* ---- Desktop layout — та сама структура, що й у budget/: .wrap на всю
     ширину (кнопка меню біля справжнього краю), а вміст центрується на 960px ---- */
  @media (min-width:880px){
    .wrap{max-width:none;margin:0;padding:0 40px 48px;}
    .home-topbar{padding-top:28px;}
    .app-menu{top:74px;left:33px;}
    .sections, .today-head, .panel, .cal{max-width:720px;margin-left:auto;margin-right:auto;}
  }


  /* Плитки — сітка 2x2 зі стат-числами. Це вже не двері («Відкрити»), а
     факт, у який можна тицьнути: головне число розділу видно без заходу. */
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:15px 16px 16px;text-decoration:none;color:inherit;display:block;
    transition:transform .15s, box-shadow .25s;}
  .tile:active{transform:scale(.985);}
  .tile-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:var(--ink-muted);}
  .tile-ico{width:16px;height:16px;flex-shrink:0;}
  .tile-name{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .tile-stat{display:flex;align-items:baseline;gap:5px;min-width:0;}
  .tile-stat b{font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);line-height:1.05;}
  .tile-stat i{font-size:13px;font-style:normal;font-weight:500;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tile-cap{font-size:12px;color:var(--ink-muted);margin-top:5px;line-height:1.35;}
  .tile-note{font-size:12px;font-weight:600;color:var(--expense);margin-top:7px;
    display:flex;align-items:center;gap:6px;}
  /* Власний display перебиває [hidden] з UA-стилів, і рядок лишався б видимим
     завжди — порожнім, з самою лише крапкою. */
  .tile-note[hidden]{display:none;}
  .tile-note::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* ---- Головна перестала бути меню ----
     Раніше це був список із чотирьох кнопок «Відкрити»: щоб відмітити справу
     й крок до цілі, треба було зайти у два розділи й вийти назад. Тепер
     екран відповідає на інше питання — що від мене хочуть сьогодні, — і
     звичайний день закривається, не виходячи звідси. Плитки лишились, але
     поїхали вниз: це вже не двері, а факт, у який можна тицьнути. */
  .today-head{margin-bottom:18px;}
  .today-date{font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .today-line{font-size:clamp(17px,3.4vw,22px);font-weight:700;letter-spacing:-0.02em;
    color:var(--ink);margin-top:5px;line-height:1.32;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;
    padding:18px 18px 14px;margin-bottom:16px;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .panel-title{font-size:15px;font-weight:700;color:var(--ink);}
  .panel-note{font-size:12px;color:var(--ink-muted);}

  /* «Сьогодні»: один список, зібраний із трьох розділів. */
  .today-sect{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-muted);font-weight:700;margin:14px 0 4px;}
  .today-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;}
  .today-row + .today-row{margin-top:2px;}
  .today-row.overdue{background:var(--expense-light);}
  .today-name{font-size:13.5px;font-weight:500;color:var(--ink);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .today-when{font-size:12px;color:var(--ink-muted);flex-shrink:0;}
  .today-row.overdue .today-when{color:var(--expense);font-weight:600;}
  .today-row.checked .today-name{color:var(--ink-muted);text-decoration:line-through;}
  .today-spacer{flex-grow:1;}
  .today-box{width:19px;height:19px;flex-shrink:0;border-radius:6px;cursor:pointer;padding:0;
    border:1.8px solid var(--card-border-hover);background:transparent;
    display:flex;align-items:center;justify-content:center;}
  .today-box.checked{background:var(--accent);border-color:var(--accent);}
  .today-box svg{display:none;width:11px;height:11px;}
  .today-box.checked svg{display:block;}
  .today-icon{flex-shrink:0;display:flex;color:var(--ink-muted);}
  .today-row.overdue .today-icon{color:var(--expense);}
  .today-more{display:flex;align-items:center;gap:6px;margin-top:6px;padding:9px 10px;
    font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;}
  .today-more svg{width:14px;height:14px;flex-shrink:0;}
  .today-go{flex-shrink:0;cursor:pointer;text-decoration:none;white-space:nowrap;
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;
    background:var(--accent);color:#fff;border:none;}
  .today-empty{font-size:13px;color:var(--ink-muted);padding:10px 10px 6px;line-height:1.45;}

  /* Календар тижня. Показує саме календарний тиждень (пн—нд), а не останні
     сім днів: день має стояти там, де він у місяці. Крапка означає рівно
     одне — на цей день є завдання. */
  .cal{margin:2px 0 16px;}
  .cal-month{font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:capitalize;
    margin-bottom:9px;padding-left:2px;}
  .cal-week{display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;}
  .cal-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;
    border-radius:13px;background:transparent;}
  .cal-dow{font-size:10.5px;font-weight:500;color:var(--ink-muted);text-transform:lowercase;}
  .cal-num{font-size:15px;font-weight:600;color:var(--ink-soft);line-height:1.1;}
  .cal-day.past .cal-num{color:var(--ink-muted);}
  .cal-day.today{background:var(--accent);}
  .cal-day.today .cal-dow, .cal-day.today .cal-num{color:#fff;}
  /* Крапка живе завжди — просто невидима без завдань. Інакше рядок із
     крапкою був би вищим за рядок без неї, і числа стрибали б по вертикалі. */
  .cal-dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .cal-day.has .cal-dot{background:var(--accent);}
  .cal-day.has.done .cal-dot{background:var(--income);}
  .cal-day.today.has .cal-dot{background:#fff;}

  @media (max-width:359px){
    .panel{padding:16px 14px 12px;border-radius:18px;}
    .cal-num{font-size:14px;}
    .tile-stat b{font-size:23px;}
  }

  /* ---- Екран входу ---- */
  #authScreen{display:none;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;
    backdrop-filter: blur(var(--glass-blur)) saturate(150%);-webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
    box-shadow: var(--glass-shadow);}
  .auth-logo{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
  .auth-title{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-hint{font-size:12px;color:var(--ink-muted);margin:4px 0 12px;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;transition:transform .15s, opacity .2s;}
  .auth-submit:active:not(:disabled){transform:scale(.97);}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}

  @media (prefers-reduced-motion: reduce){
    a.tile, .icon-btn, .theme-choice{transition:none;}
    .spinner{animation:none;opacity:.55;}
  }
</style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="bg-top-glow"></div>
    <div class="bg-top-ring"></div>
    <div class="bg-beam-tl"></div>
    <div class="bg-beam-br"></div>
  </div>

  <!-- ---- Нейтральний екран, поки Firebase перевіряє збережену сесію ---- -->
  <div id="authLoading" aria-hidden="true"><div class="spinner"></div></div>

  <!-- ---- Екран входу ---- -->
  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-logo">Life</div>
      <div class="auth-title" id="authTitle">Вхід</div>
      <div class="auth-sub" id="authSub">Увійди, щоб потрапити у свій особистий простір.</div>
      <form id="authForm" autocomplete="on">
        <label class="field-label" id="authEmailLabel" for="authEmail">Email</label>
        <input type="email" id="authEmail" name="email" autocomplete="username">
        <label class="field-label" id="authPasswordLabel" for="authPassword">Пароль</label>
        <input type="password" id="authPassword" name="password" autocomplete="current-password">
        <div class="auth-hint" id="authPasswordHint" style="display:none;">Мінімум 6 символів</div>
        <div class="auth-options-row">
          <label class="remember-me"><input type="checkbox" id="rememberMe" checked><span id="rememberMeLabel">Запам'ятати мене</span></label>
          <a id="forgotPasswordLink">Забув(ла) пароль?</a>
        </div>
        <div class="auth-error" id="authError" role="alert" aria-live="assertive"></div>
        <div class="auth-info" id="authInfo"></div>
        <button class="auth-submit" id="authSubmit" type="submit">Увійти</button>
      </form>
      <div class="auth-switch" id="authSwitch">Ще немає акаунта? <a id="authToggle">Зареєструватися</a></div>
    </div>
  </div>

  <!-- ---- Головна (після входу) ---- -->
  <div id="homeScreen" style="display:none;">
    <div class="wrap">
      <div class="home-topbar">
        <span class="home-brand">Life</span>
        <span class="topbar-spacer"></span>
        <button class="menu-btn" id="menuBtn" aria-label="Меню">
          <span class="menu-btn-lines" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>


      <div class="app-menu-overlay" id="appMenuOverlay">
        <div class="app-menu" id="appMenu">
          <div class="app-menu-label" id="themeMenuLabel">Тема</div>
          <div class="theme-picker" id="themePicker"></div>

          <div class="app-menu-divider"></div>

          <div class="app-menu-label" id="langMenuLabel">Мова</div>
          <div class="lang-picker" id="langPicker"></div>

          <div class="app-menu-divider"></div>

          <button class="app-menu-item" id="exportBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        <span id="exportLabel">Експорт даних</span>
      </button>
      <button class="app-menu-item" id="logoutBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            <span id="logoutLabel">Вийти</span>
          </button>
        </div>
      </div>

      <div class="export-overlay" id="exportOverlay">
        <div class="export-sheet">
          <div class="export-head">
            <div class="export-title" id="exportModalTitle">Експорт даних</div>
            <button type="button" class="export-close" id="exportCloseBtn" aria-label="Закрити">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="export-group-label" id="exportWhatLabel">Що зберегти</div>
          <div class="export-options" id="exportSections"></div>

          <div class="export-group-label" id="exportFormatLabel">Формат</div>
          <div class="export-options" id="exportFormats"></div>
          <div class="export-hint" id="exportFormatHint"></div>

          <button type="button" class="export-save-btn" id="exportSaveBtn">Зберегти</button>
          <div class="export-error" id="exportModalError"></div>
        </div>
      </div>

      <div class="cal">
        <div class="cal-month" id="calMonth"></div>
        <div class="cal-week" id="calWeek"></div>
      </div>

      <div class="today-head">
        <div class="today-line" id="todayLine"></div>
      </div>

      <section class="panel" id="todayPanel" hidden>
        <div class="panel-head">
          <div class="panel-title" id="todayTitle">Сьогодні</div>
          <div class="panel-note" id="todayCount"></div>
        </div>
        <div id="todayList"></div>
      </section>

      <main class="sections">
        <a class="tile" href="budget/index.html">
          <div class="tile-head">
            <svg class="tile-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
            <span class="tile-name" id="budgetTitle">Бюджет</span>
          </div>
          <div class="tile-stat"><b id="budgetStat">—</b><i id="budgetUnit"></i></div>
          <div class="tile-cap" id="budgetSub">витрати й доходи</div>
          <div class="tile-note" id="budgetNote" hidden></div>
        </a>

        <a class="tile" href="goals/index.html" id="goalsCard">
          <div class="tile-head">
            <svg class="tile-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
            <span class="tile-name" id="goalsTitle">Цілі</span>
          </div>
          <div class="tile-stat"><b id="goalsStat">—</b><i id="goalsUnit"></i></div>
          <div class="tile-cap" id="goalsSub">довгострокові</div>
          <div class="tile-note" id="goalsNote" hidden></div>
        </a>

        <a class="tile" href="tasks/index.html" id="tasksCard">
          <div class="tile-head">
            <svg class="tile-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l2 2 3.5-3.5"/><path d="M3 17.5l2 2 3.5-3.5"/><path d="M12 7h9"/><path d="M12 18h9"/></svg>
            <span class="tile-name" id="tasksTitle">Завдання</span>
          </div>
          <div class="tile-stat"><b id="tasksStat">—</b><i id="tasksUnit"></i></div>
          <div class="tile-cap" id="tasksSub">на кожен день</div>
          <div class="tile-note" id="tasksNote" hidden></div>
        </a>

        <a class="tile" href="workout/index.html" id="workoutCard">
          <div class="tile-head">
            <svg class="tile-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 8v8"/><path d="M17.5 8v8"/><path d="M3.5 10.5v3"/><path d="M20.5 10.5v3"/><path d="M6.5 12h11"/></svg>
            <span class="tile-name" id="workoutTitle">Тренування</span>
          </div>
          <div class="tile-stat"><b id="workoutStat">—</b><i id="workoutUnit"></i></div>
          <div class="tile-cap" id="workoutSub">сесії й рекорди</div>
          <div class="tile-note" id="workoutNote" hidden></div>
        </a>
      </main>
    </div>
  </div>

  <script src="budget/firebase-config.js"></script>
  <script src="categories-default.js"></script>
  <script src="export-data.js"></script>
  <script src="goals/streak.js"></script>
  <script src="tasks/stats.js"></script>
  <script src="home-summary.js"></script>
  <script src="home.js"></script>
  <script src="scroll-lock.js"></script>
</body>
</html>

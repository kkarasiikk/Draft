<!DOCTYPE html>
<html lang="uk" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- Ті самі три теги, що й у кожному модулі. Без них головна поводилась
     на iPhone інакше за решту сторінок, хоч і живе в тому ж застосунку. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<meta name="description" content="Life — особистий простір: бюджет, цілі, щоденні завдання, тренування.">
<!--
  CSP: дозволяємо лише Firebase Auth/App Check + свої файли. Firestore тут
  теж потрібен (для синхронізації вибору теми між головною та /budget/).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://www.gstatic.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdnjs.cloudflare.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://us-central1-me-and-only-me-7f531.cloudfunctions.net;
  frame-src https://www.google.com/recaptcha/ https://me-and-only-me-7f531.firebaseapp.com;
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<!-- Заздалегідь відкриваємо зʼєднання до доменів, з яких одразу підуть
     скрипти й шрифти: DNS, TLS і handshake до трьох чужих доменів — це
     помітна частка часу до першого малювання, і робити її послідовно після
     розбору <head> ні до чого. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="side-nav.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<!-- Запобіжник проти вічного спінера: має стояти після тегів SDK, див. boot-guard.js -->
<script defer src="boot-guard.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    /* Колір смуги над сторінкою — області статус-бару в standalone на iOS.
       Шар .background туди НЕ дістає: у встановленому застосунку він
       розтягується на viewport, а смуга статус-бару лежить поза ним. Малює її
       тло html, тож воно мусить дорівнювати --bg — інакше вгорі видно шов.
       Відколи тло рівне, це просто той самий колір. */
    --status-bar: #FFFFFF;
    --surface:#F5F6F8;
    --surface-flat:#EFF1F4;
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:#E9EBF0;
    --card-bg:#F5F6F8; --card-border:#E9EBF0; --card-border-hover:#DDE0E7;
    --card-hover-shadow: 0 6px 18px rgba(20,25,40,.06);
    --control-bg:#F0F1F5; --overlay:rgba(30,32,40,.28);
    --expense-light:rgba(201,104,63,.10); --accent-light:rgba(74,111,165,.10);
    --glass-btn-bg:#F0F1F5; --glass-btn-bg-hover:#E7E9EF; --glass-btn-border:#E2E4EA;
    --glass-blur:0px; --glass-shadow:0 1px 2px rgba(20,25,40,.04);
    --accent:#4A6FA5; --expense:#C9683F; --income:#4F9C74;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0B0B0E;
    --status-bar: #0B0B0E;
    --surface:#17181C;
    --surface-flat:#1E1F24;
    --ink:#ffffff; --ink-soft:#a9acb4; --ink-muted:#75787f;
    --border:#26272D;
    --card-bg:#17181C; --card-border:#26272D; --card-border-hover:#33353C;
    --card-hover-shadow: 0 6px 18px rgba(0,0,0,.35);
    --control-bg:#1C1D22; --overlay:rgba(0,0,0,.55);
    --expense-light:rgba(227,154,118,.14); --accent-light:rgba(143,174,224,.14);
    --glass-btn-bg:#1C1D22; --glass-btn-bg-hover:#25262C; --glass-btn-border:#2E2F36;
    --glass-blur:0px; --glass-shadow:0 1px 2px rgba(0,0,0,.35);
    --accent:#8FA6E0; --expense:#E39A76; --income:#7FCB9E;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  /* scrollbar-gutter лишається — він тримає ширину сторінки незмінною на
     комп'ютері. А от overflow-y:scroll малював смугу навіть тоді, коли
     гортати нічого. */
  /* Колір тла живе ТІЛЬКИ тут: html малює полотно сторінки (і те, що видно
     під час overscroll). У body його бути не повинно — див. нижче. */
  html{background:var(--status-bar);overscroll-behavior-y:none;scrollbar-gutter:stable;
    transition:background-color .2s ease;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; min-height:100svh;
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    transition:color .2s ease;
  }
  /* Тло сторінки. Лежить під вмістом (z-index:-1), і саме тому в body НЕ МОЖЕ
     бути власного тла: body — звичайний потоковий нащадок html, а потокові
     нащадки малюються ПІСЛЯ відʼємних z-index, тож непрозоре тло body
     зафарбувало б цей шар повністю. Відколи тло рівне, шар малює просто
     --bg — той самий колір, що й html під смугою статус-бару, тож шва вгорі
     не буває за побудовою. */
  .background{
    position:fixed; inset:0; z-index:-1;
    background: var(--bg); transition: background .2s ease;
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 20px 48px;}

  /* ---- Верхня панель: логотип зліва, гамбургер справа (тема / мова / вихід) ---- */
  .home-topbar{display:flex;align-items:center;justify-content:flex-start;margin-bottom:8px;}
  /* Ті самі значення, що в .app-topbar-brand решти сторінок: логотип має
     виглядати однаково скрізь, а не дрібнішати на головній. */
  .home-brand{display:flex;color:var(--ink);}
  /* Логотип — той самий знак, що на іконці застосунку: слово «Life» однією
     лінією кардіограми. Вектором і в currentColor, тож у світлій темі він
     темний, у темній білий, і другого файлу для цього не треба. */
  .brand-mark{height:46px;width:auto;display:block;}
  .topbar-spacer{flex-grow:1;}
  .menu-btn{background:none;border:none;cursor:pointer;color:var(--ink);padding:13px;display:flex;border-radius:10px;transition:background .2s, transform .15s;touch-action:manipulation;}
  .menu-btn:hover{background:var(--glass-btn-bg-hover);}
  .menu-btn:active{transform:scale(.92);}
  .menu-btn-lines{width:20px;height:16px;position:relative;display:inline-block;flex-shrink:0;}
  .menu-btn-lines span{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;
    transition:top .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1), opacity .2s ease;}
  .menu-btn-lines span:nth-child(1){top:0;}
  .menu-btn-lines span:nth-child(2){top:7px;}
  .menu-btn-lines span:nth-child(3){top:14px;}
  .menu-btn.open .menu-btn-lines span:nth-child(1){top:7px; transform:rotate(45deg);}
  .menu-btn.open .menu-btn-lines span:nth-child(2){opacity:0; transform:scaleX(0);}
  .menu-btn.open .menu-btn-lines span:nth-child(3){top:7px; transform:rotate(-45deg);}
  /* Меню налаштувань — по центру екрана, з розмитим тлом.
     Раніше воно спливало з-під кнопки на прозорій підкладці й зливалося зі
     сторінкою: світла картка на світлому тлі, і межу видно лише по тонкій
     рамці. Розмиття прибирає з-під нього деталі, тож картка читається як
     окремий шар, а не як частина сторінки.
     z-index вищий за «+» (70): інакше кругла кнопка світилася б поверх
     розмиття, ніби вона не в цій сцені. */
  .app-menu-overlay{position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:var(--overlay);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .app-menu-overlay.show{display:flex;}
  .app-menu{position:relative;background:var(--surface);
    border:1px solid var(--border);border-radius:18px;
    box-shadow:0 18px 50px rgba(20,20,30,.22), var(--glass-shadow);
    padding:16px;min-width:240px;max-width:min(300px, calc(100vw - 40px));
    transform:translateY(8px) scale(.98);opacity:0;
    transition:transform .16s ease, opacity .16s ease;}
  .app-menu-overlay.show .app-menu{transform:none;opacity:1;}
  @media (prefers-reduced-motion: reduce){ .app-menu{transition:none;} }
  /* Бургер лишається над розмиттям: він перетворюється на «×», і другий
     дотик має закривати те, що відкрив перший. */
  .menu-btn{position:relative;z-index:81;}
  .app-menu-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 6px;padding:0 2px;}
  .app-menu-divider{height:1px;background:var(--border);margin:12px 0;}
  .theme-picker, .lang-picker{display:flex;flex-wrap:wrap;gap:4px;}
  .theme-choice, .lang-choice{
    border:none;background:var(--glass-btn-bg);color:var(--ink-muted);font-family:'Inter',sans-serif;
    font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;
    transition:background .25s, color .25s, transform .15s;
  }
  .theme-choice:active, .lang-choice:active{transform:scale(.92);}
  .theme-choice.selected, .lang-choice.selected{background:var(--accent);color:#fff;}
  .app-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;
    background:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13.5px;
    color:var(--ink-soft);text-align:left;margin-top:2px;transition:background .2s, transform .15s;}
  .app-menu-item:hover{background:var(--glass-btn-bg-hover);}
  .app-menu-item:active{transform:scale(.97);}
  .app-menu-item svg{stroke:currentColor;flex-shrink:0;}

  /* ---- Діалог експорту ---- */
  .export-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
    background:var(--overlay);}
  .export-overlay.show{display:flex;}
  /* Системна смуга гортання з кнопками-стрілками випадає зі стилю шитів:
     власна — тонка й напівпрозора, як у чаті помічника. */
  .export-sheet{scrollbar-width:thin;scrollbar-color:var(--card-border-hover) transparent;}
  .export-sheet::-webkit-scrollbar{width:5px;}
  .export-sheet::-webkit-scrollbar-track{background:transparent;}
  .export-sheet::-webkit-scrollbar-thumb{background:var(--card-border-hover);border-radius:999px;}
  .export-sheet{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:480px;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
    box-shadow:var(--glass-shadow);}
  .export-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .export-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
  .export-close{background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;display:flex;}
  .export-group-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-muted);margin:14px 0 8px;}
  .export-group-label:first-of-type{margin-top:0;}
  .export-options{display:flex;flex-wrap:wrap;gap:6px;}
  /* Розділи й формати — однакові плашки: різниця лише в тому, що розділів
     можна обрати кілька, а формат один. Показувати це двома різними
     віджетами (галочки й радіо) означало б ускладнити на рівному місці. */
  .export-chip{border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;
    cursor:pointer;transition:background .2s, color .2s, transform .15s;}
  .export-chip:active{transform:scale(.95);}
  .export-chip.selected{background:var(--accent);color:#fff;border-color:transparent;}
  .export-hint{font-size:12px;color:var(--ink-muted);line-height:1.45;margin-top:8px;}
  .export-save-btn{width:100%;margin-top:18px;border:none;border-radius:12px;padding:13px 0;
    background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;}
  .export-save-btn:disabled{opacity:.55;cursor:default;}
  .export-save-btn:active:not(:disabled){transform:scale(.98);}
  .export-error{font-size:13px;color:var(--expense);margin-top:10px;min-height:16px;line-height:1.4;}

  /* ---- Форма швидкого запису просто тут ----
     Рядки «Витрата» й «Завдання» більше нікуди не ведуть: форма відкривається
     на самій головній. Перехід у розділ заради двох полів коштував повного
     перезавантаження сторінки — і назад на головну доводилось вертатись
     руками, хоч людина нікуди йти й не збиралась.

     Класи ті самі, що в модулях (.modal-overlay / .modal / .confirm-modal), і
     це не косметика: за ними стежать scroll-lock.js (замок прокрутки під
     шаром) та unsaved-guard.js (питання про незбережене). Заразом людина
     бачить рівно те вікно, до якого звикла в розділі.

     На телефоні — аркуш знизу, на комп'ютері — вікно по центру: та сама
     різниця, що в бюджеті й завданнях. */
  .modal-overlay{position:fixed;inset:0;z-index:75;display:none;
    align-items:flex-end;justify-content:center;background:var(--overlay);}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border-radius:26px 26px 0 0;width:100%;max-width:480px;
    padding:20px 20px calc(28px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    /* Вікно гортається лише вгору-вниз: без цього палець возив його вбік. */
    touch-action:pan-y;box-shadow:var(--glass-shadow);
    scrollbar-width:thin;scrollbar-color:var(--card-border-hover) transparent;}
  .modal::-webkit-scrollbar{width:5px;}
  .modal::-webkit-scrollbar-track{background:transparent;}
  .modal::-webkit-scrollbar-thumb{background:var(--card-border-hover);border-radius:999px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .modal-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
  .close-btn{background:none;border:none;cursor:pointer;color:var(--ink-muted);padding:4px;display:flex;flex-shrink:0;}
  .type-toggle{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);
    border-radius:12px;padding:3px;flex:1;margin-right:10px;}
  .type-toggle-btn{flex:1;border:none;background:none;cursor:pointer;padding:8px 6px;border-radius:9px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--ink-muted);
    transition:background .15s ease,color .15s ease;}
  .type-toggle-btn.active[data-qtype="expense"]{background:var(--expense);color:#fff;}
  .type-toggle-btn.active[data-qtype="income"]{background:var(--income);color:#fff;}
  label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .amount-input{width:100%;font-family:'Inter',sans-serif;font-size:26px;font-weight:700;border:none;
    border-bottom:2px solid var(--border);padding:8px 0;margin-bottom:16px;outline:none;
    background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;}
  .amount-input:focus{border-bottom-color:var(--accent);}
  .cat-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;margin-bottom:16px;}
  .cat-choice{padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;
    font-family:'Inter',sans-serif;border:1px solid var(--border);background:transparent;color:var(--ink-soft);}
  .cat-choice.selected{color:#fff;font-weight:600;border-color:transparent;}
  /* .amount-input свідомо НЕ виключено: у бюджеті це правило перекриває його
     рамку так само (специфічність input[type=text] вища за клас), і сума там
     виглядає полем із великою цифрою. Зробити тут «як задумано» означало б,
     що та сама форма має два різні вигляди залежно від екрана. */
  .modal input[type=text], .modal input[type=date], .modal input[type=time]{
    width:100%;font-family:'Inter',sans-serif;font-size:16px;background:transparent;color:var(--ink);
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;
    margin-top:6px;margin-bottom:16px;outline:none;}
  .modal input:focus{border-color:var(--accent);}
  /* Календарик і годинник малює сам браузер, і в темній темі вони лишались
     білою плямою: color-scheme — єдиний спосіб сказати йому про тему. */
  [data-theme="dark"] .modal input[type=date], [data-theme="dark"] .modal input[type=time]{color-scheme:dark;}
  /* Дата й час стоять поруч: разом вони одна відповідь на «коли», і в два
     рядки форма ставала вдвічі довшою за свій зміст. */
  .quick-when{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-error{color:var(--expense);font-size:13px;margin-bottom:8px;}
  .submit-btn{width:100%;margin-top:4px;padding:13px 0;border-radius:10px;border:none;cursor:pointer;
    color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;background:var(--accent);}
  .submit-btn:disabled{opacity:.55;cursor:default;}

  /* Питання «зберегти зміни?» від ../unsaved-guard.js. Сам діалог модуль
     будує собі сам, а класи бере зі сторінки — тож вони мусять бути тут.
     Вище за форму: інакше питання про форму ховалось би під нею. */
  .confirm-modal{position:fixed;inset:0;background:rgba(34,38,43,.32);display:none;
    align-items:center;justify-content:center;z-index:90;padding:20px;}
  .confirm-modal.show{display:flex;}
  .confirm-box{background:var(--surface);border-radius:22px;padding:22px;max-width:340px;width:100%;
    box-shadow:var(--glass-shadow);}
  .confirm-title{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .confirm-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:14px;}
  .btn-cancel{border:1px solid var(--glass-btn-border);background:var(--glass-btn-bg);color:var(--ink-soft);
    transition:background .35s, transform .35s;}
  .btn-cancel:hover{background:var(--glass-btn-bg-hover);transform:translateY(-3px);}

  /* «+» і шторка швидкого запису. Одна кнопка на всі чотири розділи: щоб
     записати витрату, більше не треба спершу знайти потрібний розділ. */
  .add-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:70;
    width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(20,25,40,.18);transition:transform .15s;}
  .add-fab:active{transform:scale(.94);}
  .add-fab svg{width:24px;height:24px;transition:transform .18s ease;}
  /* Кнопка лишається над меню й другим дотиком закриває його — «+» стає «×»,
     щоб це було видно, а не лише вгадувалось. */
  .add-fab.open svg{transform:rotate(45deg);}

  .add-overlay{position:fixed;inset:0;z-index:60;display:none;background:var(--overlay);}
  .add-overlay.show{display:block;}

  /* Виїжджають самі плитки вибору — без шапки й заголовка. Це не аркуш із
     вмістом, а короткий список дій: усе, що він мав би пояснити, уже
     написано в самих рядках. Стоїть над «+», щоб кнопка лишалась видимою й
     працювала другим дотиком як «закрити». */
  .add-menu{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));
    max-width:460px;margin:0 auto;
    transform:translateY(14px);opacity:0;transition:transform .18s ease, opacity .18s ease;}
  .add-overlay.show .add-menu{transform:translateY(0);opacity:1;}
  @media (prefers-reduced-motion: reduce){
    .add-menu{transition:none;}
  }

  .add-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);border-radius:16px;
    padding:13px 14px;margin-bottom:8px;box-shadow:0 4px 14px rgba(20,25,40,.08);
    text-decoration:none;color:inherit;font-family:'Inter',sans-serif;}
  .add-row:last-child{margin-bottom:0;}
  .add-row:active{transform:scale(.99);}
  .add-row[disabled]{cursor:default;box-shadow:none;}
  .add-row[disabled] .add-name{color:var(--ink-muted);}
  .add-row[disabled] .add-ico{background:var(--control-bg);color:var(--ink-muted);}
  .add-ico{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--accent-light);
    color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .add-ico svg{width:20px;height:20px;}
  .add-text{min-width:0;flex:1;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
  .add-name{font-size:15px;font-weight:700;color:var(--ink);}
  .add-hint{font-size:13px;color:var(--ink-muted);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .add-arrow{flex-shrink:0;color:var(--ink-muted);display:flex;}
  .add-arrow svg{width:18px;height:18px;}

  /* Плитки — сітка 2x2 зі стат-числами. Це вже не двері («Відкрити»), а
     факт, у який можна тицьнути: головне число розділу видно без заходу. */
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:15px 16px 16px;text-decoration:none;color:inherit;display:block;
    transition:transform .15s, box-shadow .25s;}
  .tile:active{transform:scale(.985);}
  .tile-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:var(--ink-muted);}
  .tile-ico{width:16px;height:16px;flex-shrink:0;}
  .tile-name{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  /* Плитка бюджету стоїть у обгортці, бо поверх неї лежить око. Кнопка не
     може бути всередині <a>: це невалідна розмітка, і тап по ній відкривав
     би розділ замість того, щоб сховати суму. */
  .tile-slot{position:relative;display:flex;min-width:0;}
  .tile-slot .tile{flex:1;min-width:0;}
  .tile-eye{position:absolute;top:8px;right:8px;z-index:1;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border:none;background:none;border-radius:9px;cursor:pointer;padding:0;
    color:var(--ink-muted);-webkit-tap-highlight-color:transparent;}
  .tile-eye svg{width:17px;height:17px;}
  .tile-eye:active{transform:scale(.9);}
  @media (hover:hover){ .tile-eye:hover{background:var(--surface-flat);color:var(--ink-soft);} }

  .tile-stat{display:flex;align-items:baseline;gap:5px;min-width:0;}
  .tile-stat b{font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--ink);line-height:1.05;}
  .tile-stat i{font-size:13px;font-style:normal;font-weight:500;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* Слово перед числом («Заплановано 8 завдань») є не в кожній плитці, а
     проміжок flex ставить і між порожніми елементами — тож порожній ховаємо. */
  .tile-stat i:empty{display:none;}
  /* Плитка тренувань показує НАЗВУ замість числа: назву читають, а не
     охоплюють оком одним поглядом, тож і кегль у неї свій — числові 26px
     розганяли б її на три рядки. Обрізається на другому: далі читати є де,
     плитка й так посилання в розділ. */
  .tile-stat.as-name{align-items:flex-start;}
  .tile-stat.as-name b{font-size:16px;font-weight:700;line-height:1.28;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  /* pre-line — щоб підпис міг бути у два рядки: плитка тренувань пише
     спершу сам факт («Сьогодні маєш тренування»), а під ним — яке саме.
     setStat пише текстом, тож перенос робить CSS, а не тег у розмітці. */
  /* Підпис обрізається на другому рядку трьома крапками. Тут стоїть назва
     цілі, а її пише людина — довга назва розганяла плитку на три-чотири
     рядки, тягла за собою всю сторінку в гортання, і на кожній плитці була
     своя висота. Читати далі є де: сама плитка — посилання в розділ, тож
     тап по обрізаному тексту веде рівно туди, де він цілий. */
  .tile-cap{font-size:12px;color:var(--ink-muted);margin-top:5px;line-height:1.35;white-space:pre-line;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
  /* Одне слово в підписі буває головним: «Сьогодні Є тренування». */
  .tile-cap b{font-weight:700;color:var(--ink-soft);}
  .tile-note{font-size:12px;font-weight:600;color:var(--expense);margin-top:7px;
    display:flex;align-items:center;gap:6px;}
  /* Власний display перебиває [hidden] з UA-стилів, і рядок лишався б видимим
     завжди — порожнім, з самою лише крапкою. */
  .tile-note[hidden]{display:none;}
  .tile-note::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}

  /* ---- Головна перестала бути меню ----
     Раніше це був список із чотирьох кнопок «Відкрити»: щоб відмітити справу
     й крок до цілі, треба було зайти у два розділи й вийти назад. Тепер
     екран відповідає на інше питання — що від мене хочуть сьогодні, — і
     звичайний день закривається, не виходячи звідси. Плитки лишились, але
     поїхали вниз: це вже не двері, а факт, у який можна тицьнути. */
  .today-head{margin-bottom:18px;}
  /* Дата словами — тільки на комп'ютері: на телефоні її вже несе
     календар над рядком, і двічі те саме читати нема сенсу. */
  .today-date{display:none;font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .today-line{font-size:clamp(17px,3.4vw,22px);font-weight:700;letter-spacing:-0.02em;
    color:var(--ink);margin-top:5px;line-height:1.32;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;
    padding:18px 18px 14px;margin-bottom:16px;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .panel-title{font-size:15px;font-weight:700;color:var(--ink);}
  .panel-note{font-size:12px;color:var(--ink-muted);}

  /* «Сьогодні»: один список, зібраний із трьох розділів. */
  .today-sect{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-muted);font-weight:700;margin:14px 0 4px;}
  .today-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;}
  .today-row + .today-row{margin-top:2px;}
  .today-name{font-size:13.5px;font-weight:500;color:var(--ink);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .today-when{font-size:12px;color:var(--ink-muted);flex-shrink:0;}
  .today-row.checked .today-name{color:var(--ink-muted);text-decoration:line-through;}
  .today-spacer{flex-grow:1;}
  .today-box{width:19px;height:19px;flex-shrink:0;border-radius:6px;cursor:pointer;padding:0;
    border:1.8px solid var(--card-border-hover);background:transparent;
    display:flex;align-items:center;justify-content:center;}
  .today-box.checked{background:var(--accent);border-color:var(--accent);}
  .today-box svg{display:none;width:11px;height:11px;}
  .today-box.checked svg{display:block;}
  .today-empty{font-size:13px;color:var(--ink-muted);padding:10px 10px 6px;line-height:1.45;}
  /* Те, що не вмістилось у картку, не зникає мовчки: рядок веде в розділ,
     де видно весь день. */
  .today-more{display:inline-block;margin:8px 0 2px;padding:4px 10px;font-size:12.5px;font-weight:600;
    color:var(--accent);text-decoration:none;border-radius:9px;}
  .today-more:hover{background:var(--accent-light);}

  /* Календар. На телефоні — календарний тиждень (пн—нд), а не останні сім
     днів: день має стояти там, де він у місяці. На широкому екрані —
     весь місяць (.cal-grid): смуга з семи днів лишала півсторінки порожньою.
     Крапка означає рівно одне — на цей день є завдання. */
  .cal{margin:2px 0 16px;}
  /* Шапка календаря: назва місяця й дві стрілки. Стрілки потрібні саме на
     компʼютері — пальцем календар гортається свайпом, а мишею немає чим. */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:9px;padding-left:2px;}
  .cal-month{font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:capitalize;
    background:none;border:none;padding:2px 0;font-family:'Inter',sans-serif;cursor:pointer;
    -webkit-tap-highlight-color:transparent;}
  /* Поки календар стоїть на сьогоднішньому тижні, вертатись нікуди: назва
     лишається назвою й не вдає з себе кнопку. */
  .cal-month.current{cursor:default;}
  .cal-month:not(.current){color:var(--accent);}
  /* На телефоні стрілок немає: смуга гортається пальцем, і два значки в
     шапці лише повторювали б жест, який і так під рукою. На компʼютері вони
     лишаються — там намальовано місяць, свайпнути мишею нічим. */
  .cal-nav{display:none;gap:2px;}
  .cal-arrow{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
    border:none;background:none;border-radius:8px;color:var(--ink-muted);cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .15s, color .15s;}
  .cal-arrow:hover{background:var(--glass-btn-bg-hover);color:var(--ink-soft);}
  .cal-arrow:active{transform:scale(.92);}
  /* Місяць гортається нашим власним свайпом (крок — цілий місяць), тож
     горизонтальний жест над ним забираємо собі, а вертикальний лишаємо
     сторінці. Смузі днів нижче це не потрібно: вона гортається сама. */
  .cal-grid{touch-action:pan-y;}

  /* Смуга днів гортається ВІЛЬНО, по днях — це справжня прокрутка браузера,
     а не наш перерахунок тижнями. Тягнеш пальцем — смуга їде за ним і стає
     рівно на день (scroll-snap). Короткий рух дає день-два, довгий — тиждень
     і далі; календарний тиждень пн—нд лишається лише початковим станом.
     Своя прокрутка тут не писалась би краще за браузерну: інерція, кінетика
     й повага до системних налаштувань уже є в ній. */
  .cal-week{display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;
    scroll-snap-type:x mandatory;
    /* Смуга — не список для читання, а стрічка: власна смуга гортання під
       нею лише з'їдала б висоту й шуміла. */
    scrollbar-width:none;-ms-overflow-style:none;}
  .cal-week::-webkit-scrollbar{display:none;}
  /* Сім днів у ширину екрана: клітинка — рівно сьома частина за вирахуванням
     шести проміжків. Стискатись їй не можна, інакше в кадр лізло б вісім. */
  .cal-week .cal-day{flex:0 0 calc((100% - 24px) / 7);scroll-snap-align:start;}
  /* Місяць. Дні тижня стоять шапкою над стовпчиками — один раз, а не в
     кожній із тридцяти клітинок. */
  .cal-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;}
  .cal-dow-head{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:lowercase;
    text-align:center;padding-bottom:2px;}
  .cal-grid .cal-day{justify-content:center;min-height:46px;}
  /* Хвости сусідніх місяців лишаються в сітці, інакше перший тиждень
     починався б із дірки, і число стояло б не під своїм днем тижня. Але
     читаються вони тихіше: це не цей місяць. */
  .cal-day.other-month{opacity:.38;}
  /* День — посилання в розділ завдань на цей день, тож знімаємо з нього
     все, чим браузер малює посилання, і лишаємо палець/курсор. */
  .cal-day{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:7px 3px 6px;
    border-radius:13px;background:transparent;min-width:0;
    text-decoration:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .cal-day:active{transform:scale(.94);}
  @media (hover:hover){
    .cal-day:hover{background:var(--surface-flat);}
    .cal-day.today:hover{background:var(--accent);}
  }
  .cal-dow{font-size:10.5px;font-weight:500;color:var(--ink-muted);text-transform:lowercase;text-align:center;}
  .cal-num{font-size:15px;font-weight:600;color:var(--ink-soft);line-height:1.1;text-align:center;}
  .cal-day.past .cal-num{color:var(--ink-muted);}
  .cal-day.today{background:var(--accent);}
  .cal-day.today .cal-dow, .cal-day.today .cal-num{color:#fff;}

  /* Крапка під числом. Місце під неї є завжди — інакше дні зі справами були
     б вищими за порожні, і числа стрибали б по вертикалі. Ті самі три стани,
     що й у смузі тижня в розділі завдань: нічого / є справи / все закрито. */
  .cal-dot{width:5px;height:5px;margin:3px auto 0;border-radius:50%;background:transparent;}
  .cal-dot.has{background:var(--accent);}
  .cal-dot.all-done{background:transparent;border:1px solid var(--income);}
  .cal-day.today .cal-dot.has{background:#fff;}
  .cal-day.today .cal-dot.all-done{border-color:rgba(255,255,255,.8);}

  @media (max-width:359px){
    .panel{padding:16px 14px 12px;border-radius:18px;}
    .cal-num{font-size:14px;}
    .tile-stat b{font-size:23px;}
  }

  /* ---- Екран входу ---- */
  #authScreen{display:none;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;
    box-shadow: var(--glass-shadow);}
  .auth-logo{margin-bottom:10px;color:var(--ink);}
  .auth-logo .brand-mark{height:44px;}
  .auth-title{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-hint{font-size:12px;color:var(--ink-muted);margin:4px 0 12px;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;transition:transform .15s, opacity .2s;}
  .auth-submit:active:not(:disabled){transform:scale(.97);}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}

  /* ---- Широкий екран ----
     Телефонну колонку не можна просто розтягнути: центрована смуга на 720px
     лишала півекрана порожнім, а верхня панель тим часом тулилась до самого
     краю — два різні центри в одному вікні. Тут інша розкладка: зліва меню
     розділів, справа шапка з датою й кнопкою «Записати», під нею вміст.
     Розмітка та сама, що на телефоні; переставляє її сітка. */
  /* ---- Телефон: головна тримається в одному екрані ----
     Це те саме, що вже робить широка розкладка нижче, тільки флексом замість
     сітки: шапка, календар, підпис і плитки мають свою висоту, а «Сьогодні»
     забирає рештку. Без цього сторінка гойдалась угору-вниз від будь-якої
     дрібниці — довшої назви цілі, зайвого завдання в списку.

     Висота задана саме `height`, а не `min-height`: min-height дозволив би
     блокам рости, але не стискатись, і нічого б не змінилось. При цьому
     переповнення НЕ ховається — якщо на дуже низькому екрані вміст усе одно
     не вміщається, сторінка просто гортається, як раніше. Це гірший, але
     чесний варіант: обрізати частину сторінки було б помітно гірше.

     dvh, а не vh: у мобільних браузерах адресний рядок ховається на
     гортанні, і 100vh там вищий за видиму частину. */
  @media (max-width:879px){
    .wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;}
    .home-main{flex:1;min-height:0;display:flex;flex-direction:column;}

    /* Єдиний блок, який стискається. Підлога в 128px — щоб на зовсім
       низькому екрані панель не сплющилась у смужку із самим заголовком. */
    #todayPanel{flex:1 1 auto;min-height:128px;display:flex;flex-direction:column;}
    /* Список гортається ВСЕРЕДИНІ панелі: так посилання «ще N у завданнях»
       лишається видним, а не їде вниз разом зі списком. */
    #todayList{flex:1;min-height:0;overflow-y:auto;}
    .sections{flex:0 0 auto;}
  }

  @media (min-width:880px){
    /* padding-left = поле сторінки + колонка + проміжок: колонка лежить
       окремим шаром, і місце під неї сторінка звільняє сама. */
    .wrap{max-width:none;margin:0;padding:26px 40px 48px 278px;}

    /* Логотип і гамбургер переїхали в бічне меню: тримати їх іще й угорі
       означало б показати ті самі дві речі двічі. */
    .home-topbar{display:none;}

    /* Тут колонка ще одна: календарю потрібні сім читабельних стовпчиків, а
       поки їх нема куди покласти, він іде на всю ширину. Сітка потрібна й
       так — щоб шапка стала над календарем, а не під ним, як на телефоні. */
    .home-main{display:grid;gap:18px;align-content:start;
      grid-template-columns:1fr;
      grid-template-areas:
        "head"
        "cal"
        "panel"
        "tiles";}

    .today-head{grid-area:head;margin-bottom:0;}
    .today-date{display:block;}

    #todayPanel{grid-area:panel;margin-bottom:0;}
    .cal{grid-area:cal;margin:0;
      background:var(--surface);border:1px solid var(--border);border-radius:22px;
      padding:18px 18px 14px;}
    .cal-head{margin-bottom:14px;padding-left:0;}
    .cal-nav{display:flex;}
    .cal-month{font-size:15px;font-weight:700;color:var(--ink);}
    .cal-month:not(.current){color:var(--accent);}
    .cal-arrow{width:30px;height:30px;}
    .cal-day{padding:8px 5px 7px;}
    .cal-num{font-size:17px;}
    .cal-dot{width:6px;height:6px;margin-top:4px;}
    /* Клітинка місяця дихає вільніше за клітинку тижня: рядків шість, і
       тісні квадрати читались би як таблиця, а не як календар. */
    .cal-grid{gap:6px;}
    .cal-grid .cal-day{min-height:58px;}

    .sections{grid-area:tiles;gap:18px;}
    .tile:hover{border-color:var(--card-border-hover);box-shadow:var(--card-hover-shadow);}

    /* Той самий круглий «+» у нижньому куті, що й у розділах: одна кнопка
       на всі чотири, і на комп'ютері вона стоїть там само, де в них. Колись
       тут була кнопка «Записати» в шапці — вона робила з однієї звички дві,
       залежно від того, з чого відкрив застосунок.
       Відступи ті самі, що й поля сторінки, тож кнопка сідає на її кут. */
    .add-fab{right:40px;bottom:40px;}
    .add-menu{left:auto;right:40px;bottom:112px;top:auto;width:360px;max-width:none;margin:0;}

    /* Форма швидкого запису — по центру, як і в розділах: аркуш знизу має
       сенс під великим пальцем, а не під мишею. */
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px;max-height:88vh;padding:20px 20px 24px;}
  }

  /* ---- Дві колонки ----
     Поріг саме такий, бо його ставить календар, а не шапка: у вужчому вікні
     колонка дня стискається так, що числа сусідніх днів сходяться впритул, а
     від назви справи лишається одна літера. Краще повна ширина, ніж дві
     колонки, з яких одну не прочитати. Пропорція теж не з макета (там праворуч
     стояла щільна сітка активності) — календарю потрібна ширина. */
  @media (min-width:1240px){
    .home-main{grid-template-columns:1.3fr 1fr;
      grid-template-areas:
        "head  head"
        "panel cal"
        "tiles tiles";}
    /* Обидві картки тягнуться на висоту вищої. Колись тут стояло
       align-self:start — і не дарма: під смугою з семи днів зяяла б
       порожнеча завдовжки зі список справ. Але календар став місяцем, і
       висоти зрівнялись самі; тепер рівний низ читається як один блок, а
       не як дві сходинки. Список усередині картки росте, тож «ще N»
       притискається до низу, а не висить посеред порожнечі. */
    /* На великому моніторі вміст має власну висоту й тулиться до верху, а
       під ним лишається порожнє тло — на телефоні й ноутбуці цього не
       видно, бо там вмісту рівно стільки, що він і так заповнює екран.
       Тож сітка отримує мінімальну висоту на весь екран (мінус поля
       сторінки, інакше зʼявився б зайвий пʼятдесятипіксельний скрол), а
       рядки розподіляються так: шапка й плитки за вмістом, ряд «Сьогодні +
       календар» забирає решту. Плитки від цього стають нижнім краєм
       сторінки, а не серединою.

       Це самоналаштовно: там, де вміст уже вищий за екран, min-height не
       робить нічого, і розкладка лишається такою, якою була. */
    .home-main{min-height:calc(100vh - 74px);min-height:calc(100svh - 74px);
      grid-template-rows:auto 1fr auto;align-content:stretch;}

    #todayPanel{display:flex;flex-direction:column;}
    #todayList{flex:1;}
    .cal{display:flex;flex-direction:column;}
    /* Перший рядок — шапка з днями тижня, і тягнути її нарівні з тижнями
       не можна: між підписами й числами зяяла б смуга. Тому auto їй, а
       1fr — усім рядкам після неї. */
    .cal-grid{flex:1;grid-template-rows:auto;grid-auto-rows:1fr;}
    /* Ростуть РЯДКИ, а не клітинки: сама клітинка має стелю й центрується
       в рядку. Інакше на високому екрані виділення сьогоднішнього дня
       витягувалось у високий прямокутник — синя смуга замість позначки
       дня. Зайва висота йде в проміжки між тижнями, і календар просто
       дихає вільніше. */
    /* min-height:0 — щоб у низькому вікні клітинка могла стиснутись до
       свого вмісту (число з крапкою). Стеля 58px, задана для широкого
       екрана, тримала сітку вищою за вікно ноутбука, і сторінка починала
       гортатись — рівно те, чого тут не має бути. */
    .cal-grid .cal-day{align-self:center;min-height:0;max-height:96px;}
    .sections{grid-template-columns:repeat(4,1fr);}
  }

  /* ---- Низьке вікно на широкому екрані ----
     Головна має вміщатись в один екран без гортання — заради цього її й
     розкладали. Але вміст має свою мінімальну висоту, і на ноутбуці з
     невисоким вікном (1366x768, або 1920x1080 при масштабі 125%) вона
     вилазила за край на кілька десятків пікселів: рівно стільки, щоб
     зʼявилась смуга прокрутки й уся ідея зникла.

     Тут не інша розкладка, а той самий екран, стиснутий у полях і
     проміжках: сторінка дихає вужче, але лишається однією сторінкою.
     Поріг по висоті, а не по ширині: справа саме в тому, скільки місця
     по вертикалі, а не яка діагональ у монітора. */
  @media (min-width:1240px) and (max-height:820px){
    .wrap{padding-top:20px;padding-bottom:22px;}
    .home-main{gap:14px;min-height:calc(100vh - 42px);min-height:calc(100svh - 42px);}
    .today-row{padding:7px 10px;}
    .cal{padding:14px 16px 12px;}
    .sections{gap:14px;}
  }

  @media (prefers-reduced-motion: reduce){
    a.tile, .icon-btn, .theme-choice{transition:none;}
    .spinner{animation:none;opacity:.55;}
  }
</style>

            <div class="modal-title" id="quickTitle"></div>
            <!-- Витрата чи дохід — тим самим перемикачем, що й у бюджеті:
                 запис однією дією не має залежати від того, звідки почали. -->
            <div class="type-toggle" id="quickTypeToggle" style="display:none;">
              <button type="button" class="type-toggle-btn" id="quickTypeExpense" data-qtype="expense"></button>
              <button type="button" class="type-toggle-btn" id="quickTypeIncome" data-qtype="income"></button>
            </div>
            <button type="button" class="close-btn" id="quickCloseBtn" aria-label="Закрити">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div id="quickExpenseFields">
            <label class="field-label" for="quickAmount" id="quickAmountLabel"></label>
            <input class="amount-input" id="quickAmount" type="text" inputmode="decimal" placeholder="0.00">
            <label class="field-label" id="quickCatLabel"></label>
            <div class="cat-picker" id="quickCats"></div>
            <label class="field-label" for="quickDate" id="quickDateLabel"></label>
            <input type="date" id="quickDate">
            <label class="field-label" for="quickNote" id="quickNoteLabel"></label>
            <input type="text" id="quickNote">
          </div>

          <div id="quickTaskFields">
            <label class="field-label" for="quickTaskTitle" id="quickTaskTitleLabel"></label>
            <input type="text" id="quickTaskTitle">
            <div class="quick-when">
              <div>
                <label class="field-label" for="quickTaskDate" id="quickTaskDateLabel"></label>
                <input type="date" id="quickTaskDate">
              </div>
              <div>
                <label class="field-label" for="quickTaskTime" id="quickTaskTimeLabel"></label>
                <input type="time" id="quickTaskTime">
              </div>
            </div>
            <label class="field-label" for="quickTaskNotes" id="quickTaskNotesLabel"></label>
            <input type="text" id="quickTaskNotes">
          </div>

          <div class="form-error" id="quickError" style="display:none;" role="alert" aria-live="assertive"></div>
          <button type="button" class="submit-btn" id="quickSubmitBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="budget/firebase-config.js"></script>

  <script defer src="unsaved-guard.js"></script>
  <script defer src="export-data.js"></script>

  <script defer src="goals/review.js"></script>
  <script defer src="side-nav.js"></script>
  <script defer src="home-summary.js"></script>
  <script defer src="sw-register.js"></script>
  <script defer src="home.js"></script>
  <script defer src="scroll-lock.js"></script>
</body>

  font-src 'self' https://fonts.gstatic.com;

  connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://us-central1-me-and-only-me-7f531.cloudfunctions.net https://fcmregistrations.googleapis.com https://fcm.googleapis.com;
  frame-src https://www.google.com/recaptcha/ https://me-and-only-me-7f531.firebaseapp.com;

  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Завдання · Life</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../budget/icon-192.png">
<link rel="icon" href="../budget/icon-192.png">
<!-- Заздалегідь відкриваємо зʼєднання до доменів, з яких одразу підуть
     скрипти й шрифти: DNS, TLS і handshake до трьох чужих доменів — це
     помітна частка часу до першого малювання, і робити її послідовно після
     розбору <head> ні до чого. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../side-nav.css">
<link rel="stylesheet" href="../ai-chat.css">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<!-- Запобіжник проти вічного спінера: має стояти після тегів SDK, див. boot-guard.js -->
<script defer src="../boot-guard.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    /* Колір смуги над сторінкою — області статус-бару в standalone на iOS.
       Шар .background туди НЕ дістає: у встановленому застосунку він
       розтягується на viewport, а смуга статус-бару лежить поза ним. Малює її
       тло html, тож воно мусить дорівнювати --bg — інакше вгорі видно шов.
       Відколи тло рівне, це просто той самий колір. */
    --status-bar: #FFFFFF;
    --surface:#F5F6F8;
    --surface-flat:#EFF1F4;
    --ink:#26262B; --ink-soft:#4E4E58; --ink-muted:#84838F;
    --border:#E9EBF0; --income:#4F9C74; --income-light:rgba(79,156,116,.14); --expense:#C9683F; --expense-light:rgba(201,104,63,.13); --accent:#4A6FA5; --accent-light:rgba(74,111,165,.13);
    --control-bg:#F0F1F5; --overlay:rgba(30,32,40,.28);
    --glass-blur:0px; --glass-shadow:0 1px 2px rgba(20,25,40,.04);
    --card-bg: rgba(20,25,40,.035); --card-border: rgba(20,25,40,.10); --card-border-hover: rgba(20,25,40,.22);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(20,25,40,.10), 0 0 60px rgba(20,25,40,.05);
    --glass-btn-bg: rgba(20,25,40,.05); --glass-btn-bg-hover: rgba(20,25,40,.09); --glass-btn-border: rgba(20,25,40,.16);
    --low:#4F9C74; --medium:#4A6FA5; --high:#C9683F;
    --low-light:rgba(79,156,116,.14); --medium-light:rgba(74,111,165,.13); --high-light:rgba(201,104,63,.13);
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0B0B0E;
    --status-bar: #0B0B0E;
    --surface:#17181C;
    --surface-flat:#1E1F24;
    --ink:#EFEEF3; --ink-soft:#C4C2CE; --ink-muted:#8E8C99;
    --border:#26272D; --income:#7FCB9E; --income-light:rgba(127,203,158,.14); --expense:#E39A76; --expense-light:rgba(227,154,118,.14);
    --accent:#6F93D6; --accent-light:rgba(143,174,224,.16); --control-bg:#1C1D22; --overlay:rgba(0,0,0,.55);
    --glass-blur:0px; --glass-shadow:0 1px 2px rgba(0,0,0,.35);
    --card-bg: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.12); --card-border-hover: rgba(255,255,255,.25);
    --card-glare: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0));
    --card-hover-shadow: 0 20px 80px rgba(255,255,255,.08), 0 0 60px rgba(255,255,255,.04);
    --glass-btn-bg: rgba(255,255,255,.08); --glass-btn-bg-hover: rgba(255,255,255,.16); --glass-btn-border: rgba(255,255,255,.18);
    --low:#7FCB9E; --medium:#6F93D6; --high:#E39A76;
    --low-light:rgba(127,203,158,.14); --medium-light:rgba(143,174,224,.16); --high-light:rgba(227,154,118,.14);
    color-scheme: dark;
  }
  body{transition:color .2s ease;}
  *{box-sizing:border-box;}
  /* scrollbar-gutter лишається — він тримає ширину сторінки незмінною на
     комп'ютері. А от overflow-y:scroll малював смугу навіть тоді, коли
     гортати нічого. */
  /* Колір тла живе ТІЛЬКИ тут: html малює полотно сторінки (і те, що видно
     під час overscroll). У body його бути не повинно — див. .background. */
  html{overscroll-behavior-y:none;scrollbar-gutter:stable;background:var(--status-bar);
    transition:background-color .2s ease;}
  body{margin:0;color:var(--ink);font-family:'Inter',sans-serif;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;
    min-height:100vh; min-height:100svh;}
  .wrap{max-width:480px;margin:0 auto;position:relative;z-index:1;}

  /* Шар лежить під вмістом (z-index:-1), і саме тому в body НЕ МОЖЕ бути
     власного тла: body — звичайний потоковий нащадок html, а потокові
     нащадки малюються ПІСЛЯ відʼємних z-index. Непрозоре тло body
     зафарбовувало і градієнт, і обидві плями повністю. */
  .background{position:fixed; inset:0; z-index:-1; background: var(--bg); transition: background .2s ease;}

  .auth-box, .app-menu, .task-menu, .tab-btn.active, .day-card, .card, .modal, .confirm-box{
    box-shadow: var(--glass-shadow);
  }

  .btn-cancel{
    background:var(--glass-btn-bg) !important;
    border:1px solid var(--glass-btn-border) !important;
    transition:background .35s, transform .35s, border-color .35s;
  }
  .btn-cancel:hover{background:var(--glass-btn-bg-hover) !important; transform:translateY(-3px);}

  @keyframes cardIn{ from{opacity:0; transform:translateY(24px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Auth screen ---- */
  #authScreen{display:none;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  #authLoading{display:flex;min-height:100vh; min-height:100svh;align-items:center;justify-content:center;padding:24px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--glass-btn-border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.spinner{animation:none;opacity:.55;}}
  .auth-box{max-width:360px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:32px 26px;}
  .auth-logo{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--accent);}
  .auth-title{font-family:'Inter',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .auth-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:22px;line-height:1.5;}
  .auth-box label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .auth-box input[type=email],.auth-box input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:16px;
    border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;margin-bottom:14px;outline:none;color:var(--ink);background:var(--bg);}
  .auth-box input[type=email]:focus,.auth-box input[type=password]:focus{border-color:var(--accent);}
  .auth-error{color:var(--expense);font-size:13px;margin-bottom:10px;display:none;}
  .auth-info{color:var(--income);font-size:13px;margin-bottom:10px;display:none;}
  .auth-options-row{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 14px;gap:10px;}
  .remember-me{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .remember-me input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0;}
  #forgotPasswordLink{font-size:12.5px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .auth-submit{width:100%;padding:12px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;background:var(--accent);
    font-size:14.5px;font-weight:600;font-family:'Inter',sans-serif;}
  .auth-submit:disabled{opacity:.6;cursor:default;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-muted);}
  .auth-switch a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;}
  .lang-row{display:flex;justify-content:center;gap:6px;margin-top:20px;}
  .lang-chip{padding:5px 11px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
    border:1px solid var(--border);background:transparent;color:var(--ink-muted);}
  .lang-chip.selected{background:var(--accent-light);color:var(--accent);border-color:transparent;font-weight:600;}

  /* ---- Main app ---- */
  #appScreen{display:none;}
  /* ---- Шапка модуля ---- */
  /* Той самий напис, що й на головній, тільки менший: одна впізнавана
     позначка «де я» замість іконки з дрібним підписом. */
  .app-topbar{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 20px 10px;}
  .app-topbar-brand{font-family:'Inter',sans-serif;font-size:30px;font-weight:900;letter-spacing:-0.04em;
    line-height:1;color:var(--ink);text-decoration:none;}
  .menu-btn{background:none;border:none;cursor:pointer;color:var(--ink);padding:13px;display:flex;border-radius:10px;transition:background .2s, transform .15s;touch-action:manipulation;}
  .menu-btn:hover{background:var(--border);}
  .menu-btn:active{transform:scale(.92);}
  .app-menu-overlay, .task-menu-overlay{position:fixed;inset:0;z-index:55;display:none;}
  .app-menu-overlay.show, .task-menu-overlay.show{display:block;}
  .app-menu{position:absolute;top:calc(64px + env(safe-area-inset-top));right:16px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 28px rgba(45,42,38,.14);
    padding:6px;min-width:230px;max-width:min(300px, calc(100vw - 32px));}
  .app-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;
    background:none;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;
    color:var(--ink-soft);text-align:left;}
  .app-menu-item:hover{background:var(--bg);}
  .app-menu-item:active{transform:scale(.98);}
  .app-menu-divider{height:1px;background:var(--border);margin:6px 2px;}
  .task-menu{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 10px 28px rgba(45,42,38,.14);padding:6px;min-width:170px;}
  .content{padding:20px 20px 0;}
  #dayViewScreen{padding:16px 20px 40px;}
  .cal-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .cal-nav-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;
    border-radius:50%;border:1px solid var(--border);background:var(--glass-btn-bg);color:var(--ink-soft);
    cursor:pointer;transition:background .2s;}
  .cal-nav-btn:hover{background:var(--glass-btn-bg-hover);}
  .cal-month-label{flex:1;text-align:center;font-family:'Inter',sans-serif;font-size:15.5px;font-weight:700;
    color:var(--ink);background:none;border:none;cursor:pointer;padding:6px 4px;border-radius:8px;}
  .cal-month-label:hover{background:var(--glass-btn-bg);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px;}
  .cal-weekday{text-align:center;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-muted);padding-bottom:2px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px;}
  .cal-day{min-height:64px;border-radius:12px;border:1px solid var(--border);background:var(--surface-flat);
    padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .15s,border-color .15s;}
  .cal-day:hover{background:var(--bg);}
  .cal-day.other-month{opacity:.35;}
  .cal-day.today{border-color:var(--accent);}
  .cal-day.today .cal-day-num{color:var(--accent);}
  .cal-day-num{font-size:12px;font-weight:600;color:var(--ink);}
  .cal-day.past .cal-day-num{color:var(--ink-muted);}
  .cal-day-tasks{display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0;}
  .cal-chip{font-size:9.5px;font-weight:600;line-height:1.3;padding:2px 5px;border-radius:6px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;background:var(--accent-light);color:var(--accent);}
  .cal-chip-high{background:var(--high-light);color:var(--high);}
  .cal-chip-medium{background:var(--medium-light);color:var(--medium);}
  .cal-chip-low{background:var(--low-light);color:var(--low);}
  .cal-chip-done{opacity:.5;text-decoration:line-through;}
  .cal-chip-more{font-size:9.5px;font-weight:600;color:var(--ink-muted);padding:1px 5px;cursor:pointer;}
  /* На телефоні в клітинку 44px влазить лише «Дз…» — тому там завдання
     показуються крапками (колір = пріоритет), а назви лишаються на широких
     екранах, де вони реально читаються. Кількість важливіша за уривок назви. */
  @media (max-width:599px){
    .cal-day-tasks{flex-direction:row;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;padding-top:2px;}
    .cal-chip{width:7px;height:7px;padding:0;border-radius:50%;font-size:0;line-height:0;overflow:hidden;flex-shrink:0;}
    .cal-chip-done{opacity:.4;}
    .cal-chip-more{font-size:9px;padding:0;}
  }
  .cal-year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;}
  .cal-month-tile{min-height:76px;border-radius:14px;border:1px solid var(--border);background:var(--surface-flat);
    padding:14px 10px;cursor:pointer;transition:background .15s;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;}
  .cal-month-tile:hover{background:var(--bg);}
  .cal-month-tile.today{border-color:var(--accent);}
  .cal-month-tile.today .cal-month-tile-name{color:var(--accent);}
  .cal-month-tile-name{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--ink);}
  .cal-month-tile-count{font-size:11px;font-weight:600;background:var(--accent-light);
    color:var(--accent);border-radius:10px;padding:1px 8px;}
  .day-view-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .day-view-date{flex:1;text-align:center;font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;color:var(--ink);}
  .day-view-spacer{width:34px;flex-shrink:0;}
  .day-view-empty{text-align:center;padding:48px 20px;color:var(--ink-muted);}
  .day-view-empty .title{font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  /* ---- Нижня панель навігації (та сама, що в «Бюджеті») ---- */
  /* Вкладки — простий рядок однакових кнопок, як у «Бюджеті». Поділ на дві
     групи лишався від часів, коли між ними сиділа кругла кнопка «+»: вона
     давно живе окремо (.bn-fab), а на широкому екрані, де «Головна» схована,
     половина панелі просто стояла б порожньою. */
  .bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:25;
    max-width:400px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:7px 4px;background:var(--surface);
    border:1px solid var(--border);border-radius:26px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.16);}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:6px 1px;border-radius:14px;
    text-decoration:none;-webkit-tap-highlight-color:transparent;min-width:0;}
  .bn-item svg{flex-shrink:0;transition:transform .12s ease;}
  .bn-item span{font-size:10px;font-weight:600;font-family:'Inter',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .bn-item.active{color:var(--accent);}
  .bn-item.active svg{transform:translateY(-1px);}
  /* «Плюс» більше не сидить усередині меню. Тепер праворуч виростає
     стовпчик: помічник згори, під ним додавання, під ними — самі вкладки.
     Меню від цього стає тим, чим і має бути: рядком сторінок без чужої
     кнопки посередині.
     Відступ знизу — висота меню (62px) плюс його власний відступ і просвіт;
     (помічник переїхав у шапку — див. .ai-topbar-btn в ai-chat.css). */
  .bn-fab{position:fixed;right:var(--fab-right, 14px);
    bottom:calc(var(--fab-bottom, 86px) + env(safe-area-inset-bottom));z-index:26;
    width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(92,124,250,.4), 0 2px 8px rgba(20,20,24,.12);transition:transform .15s ease;
    -webkit-tap-highlight-color:transparent;}
  .bn-fab:active{transform:scale(.92);}
  /* ---- Нагадування ---- */
  .remind-state{font-size:13.5px;line-height:1.5;color:var(--ink-soft);background:var(--surface);
    border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:14px;}
  .remind-state.warn{color:var(--high);}
  .hour-picker{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;margin-bottom:14px;}
  .hour-chip{border:1px solid var(--border);background:transparent;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:9px;cursor:pointer;}
  .hour-chip.selected{border-color:transparent;background:var(--accent-light);color:var(--accent);}

  /* ---- Шаблони ---- */
  /* Шаблон — це готовий набір кроків. Живуть вони в швидкому додаванні,
     бо саме там людина вирішує «що зараз завести». */
  .template-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;}
  .template-row:empty{display:none;}
  .template-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--control-bg);color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:12.5px;
    font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;max-width:100%;}
  .template-chip .count{color:var(--ink-muted);font-weight:500;}
  .template-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .template-manage{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .template-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;padding:10px 12px;}
  .template-item-body{flex:1;min-width:0;}
  .template-item-name{font-size:14.5px;font-weight:600;word-break:break-word;}
  .template-item-meta{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .template-item-del{flex-shrink:0;border:none;background:none;color:var(--high);cursor:pointer;padding:6px;display:flex;}
  .template-empty{font-size:13.5px;line-height:1.5;color:var(--ink-muted);text-align:center;padding:22px 6px;}
  .link-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:13px;
    font-weight:600;cursor:pointer;padding:6px 0;}


  /* ---- Повторення ---- */
  .recur-weekdays{display:flex;gap:4px;margin-bottom:10px;}
  .recur-weekday{flex:1;min-width:0;border:1px solid var(--border);background:transparent;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:8px 2px;border-radius:8px;cursor:pointer;}
  .recur-weekday.selected{border-color:transparent;background:var(--accent-light);color:var(--accent);}
  .recur-interval{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px;color:var(--ink-soft);}
  .recur-interval input{width:72px;margin:0;flex-shrink:0;}
  .recur-anchor{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);
    margin-bottom:16px;cursor:pointer;user-select:none;}
  .recur-anchor input{width:16px;height:16px;margin:0;accent-color:var(--accent);flex-shrink:0;}

  /* ---- Рядок тижня: головний спосіб пересуватись по днях ---- */
  .topbar-actions{margin-left:auto;display:flex;gap:8px;}
  /* Без плашки: у решті розділів налаштування — просто три крапки поруч із
     назвою, і рамка тут вибивалась із загального вигляду. */
  .topbar-icon-btn{flex-shrink:0;background:none;border:none;color:var(--ink-muted);
    padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .topbar-icon-btn:hover{color:var(--ink);}
  .topbar-icon-btn:active{transform:scale(.94);}
  /* pan-y лишає браузеру вертикальний скрол, а горизонтальний рух віддає нам —
     без цього браузер міг би перехопити жест і гортання не спрацювало б. */
  .swipe-area{touch-action:pan-y;}
  .swipe-slide-left{animation:slideFromRight .18s ease-out;}
  .swipe-slide-right{animation:slideFromLeft .18s ease-out;}
  @keyframes slideFromRight{from{opacity:.4;transform:translateX(14px);}to{opacity:1;transform:none;}}
  @keyframes slideFromLeft{from{opacity:.4;transform:translateX(-14px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .swipe-slide-left,.swipe-slide-right{animation:none;}
  }
  .week-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .week-label{flex:1;text-align:center;font-size:14.5px;font-weight:700;color:var(--ink);}
  /* Назва тижня на вкладці планів — кнопка «вернутись у цей тиждень». Поки
     тиждень і так поточний, вертатись нікуди: вона лишається назвою. */
  .plan-label{background:none;border:none;padding:4px 0;cursor:pointer;
    font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  .plan-label.current{cursor:default;}
  .plan-label:not(.current){color:var(--accent);}
  /* Рядок «записати думку». Стоїть над списком, а не за плаваючим «+»: уся
     суть вкладки — записати, поки думка є. */
  /* Перемикач «План / Нотатка» — той самий вигляд, що у вкладок фільтра
     статусу в цілях: два слова, одне підсвічене. */
  .plan-kind{display:flex;gap:6px;margin-bottom:10px;}
  .plan-kind-btn{border:1px solid var(--border);background:transparent;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:7px 14px;
    border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
  .plan-kind-btn.active{background:var(--accent);color:#fff;border-color:transparent;}

  .plan-add-row{display:flex;gap:8px;margin-bottom:6px;}
  .plan-add-row input{flex:1;min-width:0;font-family:'Inter',sans-serif;font-size:15px;
    border:1px solid var(--border);border-radius:12px;padding:11px 13px;outline:none;
    background:var(--surface);color:var(--ink);}
  .plan-add-row input:focus{border-color:var(--accent);}
  .plan-add-btn{flex-shrink:0;width:44px;border:none;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:22px;line-height:1;font-family:'Inter',sans-serif;}
  .plan-add-btn:active{transform:scale(.96);}
  .plan-error{color:var(--expense);font-size:13px;min-height:18px;margin-bottom:6px;}
  .plan-error:empty{min-height:0;}
  /* Позначка на пункті, що приїхав із давнішого тижня. Не докір, а факт:
     інакше він виглядав би як щойно записаний. Стоїть серед решти підписів
     рядка — тими самими плашками, що час, пріоритет і теги. */
  .plan-carried{font-size:11px;font-weight:600;color:var(--ink-muted);
    background:var(--control-bg);border-radius:999px;padding:2px 8px;}

  /* Нотатки. Без галочки — її на нотатці нема що ставити, — і тому це не
     рядок списку, а картка тексту: видно, що з нею нічого «робити» не треба. */
  .plan-notes-label{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-muted);font-family:'Inter',sans-serif;font-weight:600;
    margin:22px 0 8px;padding-left:2px;}
  .plan-note{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:13px 15px;margin-bottom:8px;cursor:pointer;font-size:14.5px;line-height:1.45;
    color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .plan-note:hover{border-color:var(--accent);}

  .week-viewport{overflow:hidden;margin-bottom:18px;}
  .week-track{display:flex;width:300%;transform:translate3d(-33.3333%,0,0);}
  .week-track.animating{transition:transform .22s cubic-bezier(.22,.61,.36,1);}
  .week-strip{flex:0 0 33.3333%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  /* Сусідні тижні трохи приглушені, поки не стали активними — так видно,
     що вони «під рукою», але вони не сперечаються за увагу з поточним. */
  .week-strip.adjacent{opacity:.45;}
  @media (prefers-reduced-motion: reduce){
    .week-track.animating{transition:none;}
  }
  .week-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:14px;
    border:1px solid transparent;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s;}
  .week-day-name{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);}
  .week-day-num{font-size:16px;font-weight:700;color:var(--ink-soft);line-height:1;font-variant-numeric:tabular-nums;}
  /* Крапка = на цей день щось заплановано; порожня — усе зроблено. */
  .week-day-dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .week-day-dot.has{background:var(--accent);}
  .week-day-dot.all-done{background:transparent;border:1px solid var(--income);}
  .week-day.today .week-day-num{color:var(--accent);}
  .week-day.today .week-day-name{color:var(--accent);}
  .week-day.selected{background:var(--accent);border-color:transparent;}
  .week-day.selected .week-day-num,.week-day.selected .week-day-name{color:#fff;}
  .week-day.selected .week-day-dot.has{background:#fff;}
  .week-day.selected .week-day-dot.all-done{border-color:rgba(255,255,255,.8);}
  .week-day.other-month .week-day-num{opacity:.5;}

  .day-heading{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px 2px;}
  .month-hint{font-size:12.5px;color:var(--ink-muted);text-align:center;line-height:1.45;padding:0 10px 8px;}

  /* Підпис перед рядком чипів («Шаблони:»). Клас лишився від картки
     «Зараз», де такий рядок зʼявився вперше; сама картка прибрана, а
     рядок шаблонів ним і далі користується — тому й перейменований. */
  .chip-row-label{font-size:11.5px;color:var(--ink-muted);margin-right:1px;}

  /* ---- Швидке додавання ---- */
  .quick-preview{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;margin:2px 0 10px;}
  .quick-chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;
    background:var(--accent-light);color:var(--accent);}
  .quick-chip.muted{background:var(--control-bg);color:var(--ink-muted);}
  .quick-hint{font-size:12px;line-height:1.45;color:var(--ink-muted);margin-bottom:12px;}
  .btn-secondary{border:1px solid var(--border);background:transparent;color:var(--ink-soft);font-weight:500;
    border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}

  /* ---- Пріоритет / теги / підзадачі у формі ---- */
  .priority-picker{display:flex;gap:4px;margin-top:6px;margin-bottom:16px;}
  .priority-choice{flex:1;min-width:0;border:1px solid var(--border);background:transparent;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:9px 4px;border-radius:8px;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .priority-choice.selected{border-color:transparent;background:var(--accent-light);color:var(--accent);}
  .priority-choice.selected[data-priority="high"]{background:var(--high-light);color:var(--high);}
  .priority-choice.selected[data-priority="medium"]{background:var(--medium-light);color:var(--medium);}
  .priority-choice.selected[data-priority="low"]{background:var(--low-light);color:var(--low);}
  /* Нагадування — до пʼяти варіантів із довшими підписами («У час завдання»),
     а базовий .priority-picker розрахований на чотири рівні клітинки
     пріоритету: набитий у той самий рядок текст обрізало б до «У час …».
     Тут кнопки переносяться й сідають по своєму тексту, а не тиснуться. */
  /* Клас звався `wrap` — і потрапляв під правила сторінкового .wrap, який
     задає ширину колонки вмісту. На комп'ютері це вже видно: вибір нагадувань
     усередині форми діставав ліве поле сторінки. Назва мусить казати, що
     вона робить, і не збігатися з чужою. */
  .priority-picker.multiline{flex-wrap:wrap;}
  .priority-picker.multiline .priority-choice{flex:0 1 auto;white-space:normal;}
  /* Поле оцінки — вузьке: 4 цифри більше не треба, а повна ширина створює
     враження, що туди мають писати щось довге. */
  #taskEstimateInput{max-width:140px;}
  .tags-editor{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:26px;}
  .tag-edit-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 6px 4px 10px;
    border-radius:20px;background:var(--accent-light);color:var(--accent);}
  .tag-edit-chip button{border:none;background:none;color:inherit;cursor:pointer;display:flex;padding:0;opacity:.75;}
  .tag-edit-chip button:hover{opacity:1;}
  .subtasks-editor{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .subtask-row{display:flex;align-items:center;gap:8px;}
  .subtask-row input[type=text]{margin:0;flex:1;min-width:0;}
  .subtask-check{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);
    background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;padding:0;}
  .subtask-check svg{display:none;width:12px;height:12px;}
  .subtask-check.checked{background:var(--income);border-color:var(--income);}
  .subtask-check.checked svg{display:block;}
  .subtask-remove{flex-shrink:0;border:none;background:none;color:var(--ink-muted);cursor:pointer;display:flex;padding:4px;}
  .add-subtask-btn{margin-top:8px;margin-bottom:16px;border:none;background:none;color:var(--accent);
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0;}

  .day-group{margin-bottom:18px;}
  .day-label{display:flex;align-items:baseline;gap:6px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);
    font-family:'Inter',sans-serif;font-weight:600;margin-bottom:8px;padding-left:2px;}
  .day-card{background:var(--surface);border-radius:20px;border:1px solid var(--border);overflow:hidden;}

  /* ---- Свайп по завданню ---- */
  /* Рядок їде за пальцем, а під ним відкривається дія. Смуга дії
     розтягнута на всю ширину, тож при швидкому русі під рядком ніколи не
     видно порожнечі — видно колір того, що зараз станеться. */
  .task-swipe{position:relative;overflow:hidden;touch-action:pan-y;}
  .task-swipe .task-row{position:relative;z-index:1;}
  .task-swipe.dragging .task-row{transition:none;}
  .task-swipe .task-row{transition:transform .16s cubic-bezier(.22,.61,.36,1);}
  /* Смуга росте рівно на стільки, на скільки відʼїхав рядок. Розтягнути її
     на всю ширину не можна: картка завдання напівпрозора (скло), і колір
     просвічував би крізь сам рядок. */
  .swipe-bg{position:absolute;top:0;bottom:0;width:0;display:flex;align-items:center;overflow:hidden;}
  /* Відступ живе на вкладеному елементі, а не на смузі: за box-sizing:border-box
     падінг не дав би ширині впасти до нуля, і смуги стирчали б на кожному рядку. */
  .swipe-bg-inner{display:flex;align-items:center;gap:7px;padding:0 16px;white-space:nowrap;
    font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:#fff;}
  .swipe-bg.done{left:0;background:var(--income);justify-content:flex-start;}
  .swipe-bg.later{right:0;background:var(--expense);justify-content:flex-end;}
  .task-row{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border-top:1px solid var(--border);cursor:pointer;}
  .task-swipe:first-child .task-row, .task-row:first-child{border-top:none;}
  .task-row:hover{background:var(--bg);}
  .task-check{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
    background:var(--surface-flat);cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0;color:#fff;margin-top:1px;transition:background .15s, border-color .15s;}
  .task-check svg{display:none;width:13px;height:13px;}
  .task-check.checked{background:var(--income);border-color:var(--income);}
  .task-check.checked svg{display:block;}
  .task-check.priority-high{border-color:var(--high);}
  .task-check.priority-medium{border-color:var(--medium);}
  .task-check.priority-low{border-color:var(--low);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;color:var(--ink);line-height:1.4;word-break:break-word;}
  .task-row.done .task-title{color:var(--ink-muted);text-decoration:line-through;}
  .task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;}
  .task-time{font-size:11.5px;font-weight:600;color:var(--ink-muted);white-space:nowrap;}
  .task-progress{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
  .tag-chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;
    background:var(--accent-light);color:var(--accent);}
  /* Мітка цілі, з якої прийшло завдання. Приглушена: це контекст, а не тег
     і не пріоритет — по ній не фільтрують, її просто впізнають. */
  .goal-chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;
    background:var(--glass-btn-bg);color:var(--ink-muted);}
  .priority-chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .priority-chip.high{background:var(--high-light);color:var(--high);}
  .priority-chip.medium{background:var(--medium-light);color:var(--medium);}
  .priority-chip.low{background:var(--low-light);color:var(--low);}

  .card{position:relative;background:var(--card-bg);    border:1px solid var(--card-border);border-radius:24px;padding:22px;margin-bottom:16px;overflow:hidden;
    transition:transform .35s, border-color .35s, box-shadow .35s;animation:cardIn .6s ease forwards;}
  .card::before{content:""; position:absolute; inset:0; background:var(--card-glare); pointer-events:none;}
  .card-title{font-family:'Inter',sans-serif;font-size:15.5px;font-weight:600;margin-bottom:4px;position:relative;}

  .modal-overlay{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-overlay.show{display:flex;}
  /* Системна смуга гортання з кнопками-стрілками випадає зі стилю шитів:
     власна — тонка й напівпрозора, як у чаті помічника. */
  .modal{scrollbar-width:thin;scrollbar-color:var(--card-border-hover) transparent;}
  .modal::-webkit-scrollbar{width:5px;}
  .modal::-webkit-scrollbar-track{background:transparent;}
  .modal::-webkit-scrollbar-thumb{background:var(--card-border-hover);border-radius:999px;}
  .modal{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:480px;
    max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    /* Вікно гортається лише вгору-вниз. touch-action:pan-y забороняє браузеру
       возити його вбік пальцем — саме це й виглядало як «менюшка плаває»:
       вміст їхав убік, і половина форми ховалась за краєм екрана.
       overflow-x:hidden — щоб і випадковий ширший вміст (довга назва,
       широкий рядок чипів) не робив горизонтальної прокрутки. */
    touch-action:pan-y;overflow-x:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:700;}
  .close-btn{background:none;border:none;cursor:pointer;color:var(--ink-muted);}
  label.field-label{font-size:12px;color:var(--ink-muted);font-weight:500;display:block;margin-top:2px;}
  .title-input{width:100%;font-family:'Inter',sans-serif;font-size:20px;font-weight:700;border:none;
    border-bottom:2px solid var(--border);padding:8px 0;margin-bottom:16px;outline:none;background:transparent;color:var(--ink);}
  .title-input:focus{border-color:var(--accent);}
  input[type=time], input[type=text], textarea, select{width:100%;font-family:'Inter',sans-serif;font-size:15.5px;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-top:6px;margin-bottom:16px;outline:none;color:var(--ink);background:var(--bg);}
  input[type=time]:focus, input[type=text]:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;min-width:0;}
  .form-error{color:var(--expense);font-size:13px;margin-bottom:8px;}
  .submit-btn{width:100%;margin-top:4px;padding:13px 0;border-radius:10px;border:none;cursor:pointer;color:#fff;
    font-size:15px;font-weight:600;font-family:'Inter',sans-serif;background:var(--accent);}
  .submit-btn:disabled{opacity:.55;cursor:default;}
  .modal-actions{display:flex;gap:8px;}

  /* ---- Кастомний datepicker (замінює нативний календар браузера) ---- */
  .dp-field{position:relative;margin-top:6px;margin-bottom:16px;}
  input[data-dp-native]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}
  .dp-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-family:'Inter',sans-serif;font-size:15.5px;text-align:left;
    border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--bg);color:var(--ink);
    cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .dp-trigger:hover, .dp-trigger:focus-visible{border-color:var(--accent);}
  .dp-field.open .dp-trigger{border-color:var(--accent);}
  .dp-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dp-trigger-text.dp-placeholder{color:var(--ink-muted);}
  .dp-trigger-icon{flex-shrink:0;color:var(--ink-muted);display:flex;}
  .dp-panel{position:fixed;z-index:55;width:280px;max-width:calc(100vw - 32px);
    background:var(--surface);    border:1px solid var(--border);border-radius:18px;box-shadow:var(--glass-shadow), 0 12px 34px rgba(20,20,30,.18);
    padding:14px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .14s ease,transform .14s ease;}
  .dp-panel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-head-label{font-size:14px;font-weight:600;color:var(--ink);text-transform:capitalize;}
  .dp-nav{display:flex;gap:4px;}
  .dp-nav-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .dp-nav-btn:hover{border-color:var(--accent);color:var(--accent);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .dp-weekday{font-size:11px;font-weight:600;color:var(--ink-muted);text-align:center;padding:4px 0;text-transform:uppercase;}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dp-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);background:transparent;border:none;border-radius:50%;
    cursor:pointer;}
  .dp-day:hover:not(:disabled):not(.dp-day-selected){background:var(--accent-light);}
  .dp-day.dp-day-muted{color:var(--ink-muted);opacity:.45;}
  .dp-day.dp-day-today:not(.dp-day-selected)::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);}
  .dp-day.dp-day-selected{background:var(--accent);color:#fff;font-weight:600;}
  .dp-day:disabled{opacity:.28;cursor:default;}
  .dp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .dp-today-btn, .dp-clear-btn{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px;}
  .dp-clear-btn{color:var(--ink-muted);}
  .dp-today-btn:hover, .dp-clear-btn:hover{text-decoration:underline;}
  .modal-actions .submit-btn{margin-top:0;flex:1;}
  .btn-delete{border:none;background:var(--expense);color:#fff;font-weight:500;border-radius:10px;padding:13px 18px;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif;}

  .confirm-modal{position:fixed;inset:0;background:rgba(34,38,43,.32);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .confirm-modal.show{display:flex;}
  .confirm-box{background:var(--surface);border-radius:22px;padding:22px;max-width:340px;width:100%;}
  .confirm-title{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:700;margin-bottom:6px;}
  .confirm-sub{font-size:13.5px;color:var(--ink-muted);margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;}
  .btn-cancel{border:1px solid var(--border);background:transparent;color:var(--ink-soft);}

  svg.icon{display:inline-block;vertical-align:middle;}

  @media (min-width:880px){
    body{padding-bottom:32px;}
    /* Місце під бічну колонку: вона лежить окремим шаром (side-nav.css),
       тож сторінка лише звільняє їй ліве поле. Логотип переїхав туди ж —
       тримати «Life» ще й у шапці означало б показати те саме двічі. */
    .wrap{max-width:none;margin:0;padding:26px 40px 0 278px;}
    .app-topbar-brand{display:none;}
    .app-topbar{padding:2px 0 0;}
    .content{max-width:960px;margin:0 auto;padding:20px 4px 40px;}
    #dayViewScreen{max-width:960px;margin:0 auto;padding:20px 4px 40px;}
    .cal-day{min-height:100px;padding:8px 6px;}
    .cal-chip{font-size:11px;padding:3px 7px;}
    .cal-year-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
    .cal-month-tile{min-height:96px;}
    .bottom-nav{left:auto;right:32px;bottom:32px;margin:0;width:350px;}
    .bn-fab{--fab-right:32px;--fab-bottom:104px;}
    .modal-overlay{align-items:center;}
    .modal{border-radius:18px;max-height:88vh;}
  }
</style>
</head>
<body>

<div class="background"></div>

<div id="authLoading" aria-hidden="true"><div class="spinner"></div></div>

        <span id="templatesMenuLabel">Шаблони</span>
      </button>

  <!-- ---- Екран ДНЯ: смуга тижня згори + завдання обраного дня ---- -->
  <div id="dayScreen">
  <div class="content">

    <div id="weekSwipeArea" class="swipe-area">
    <div class="week-head">
      <button type="button" id="weekPrevBtn" class="cal-nav-btn" aria-label="Попередній тиждень">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="week-label" id="weekLabel"></div>
      <button type="button" id="weekNextBtn" class="cal-nav-btn" aria-label="Наступний тиждень">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="week-viewport">
      <div class="week-track" id="weekTrack"></div>
    </div>
    </div>

    <div id="tagFilterRow" class="tag-filter-row"></div>

    <div id="dayList"></div>
    <div id="noDateSection"></div>
  </div>
  </div>

  <!-- ---- Екран ТИЖНЯ: ідеї та плани без конкретного дня ----
       Не «завдання на понеділок», а «зробити цього тижня»: намір, ідея,
       справа без години. У базі це те саме завдання, лише з полем weekStart
       замість dueDate — див. week-plan.js. -->
  <div id="weekPlanScreen" style="display:none;">
  <div class="content">
    <div class="week-head">
      <button type="button" id="planPrevBtn" class="cal-nav-btn" aria-label="Попередній тиждень">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <!-- Назва тижня — кнопка «вернутись у цей тиждень»: той самий жест, що
           в календарі цілей, тренувань і на головній. -->
      <button type="button" class="week-label plan-label" id="planLabel"></button>
      <button type="button" id="planNextBtn" class="cal-nav-btn" aria-label="Наступний тиждень">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Рядок додавання стоїть просто тут, а не за плаваючим «+»: уся суть
         вкладки — записати думку, поки вона є.
         Перемикач над ним каже, ЩО саме записуєш: план виконують, нотатку
         читають, і галочка на нотатці не означала б нічого. -->
    <div class="plan-kind" id="planKind">
      <button type="button" class="plan-kind-btn active" data-kind="plan" id="planKindPlan"></button>
      <button type="button" class="plan-kind-btn" data-kind="note" id="planKindNote"></button>

    <div id="planList"></div>
    <div id="planNotes"></div>

      <div class="form-error" id="taskFormError"></div>

      <button type="button" class="link-btn" id="saveAsTemplateBtn">Зберегти як шаблон</button>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="deleteTaskBtn" style="display:none;">Видалити</button>
        <button class="submit-btn" id="taskSubmitBtn" type="submit">Зберегти</button>
      </div>
    </form>
  </div>
